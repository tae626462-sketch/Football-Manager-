<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1d12">
<title>KG ผู้จัดการทีม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07140d;--pan:#0f2418;--pan2:#163222;--line:#244a33;--tx:#ecf7ef;--mut:#8db59a;--ac:#22c55e;--ac2:#facc15;--bad:#f87171;--blue:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Kanit,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#0d2a19,#0a1f13);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.top .tt small{color:var(--mut);font-size:12px}
.money{font-weight:600;color:var(--ac2);text-align:right;font-size:14px;white-space:nowrap}
.money small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:4px;vertical-align:middle}
.dot.off{background:var(--bad)}
.badge{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;border:2px solid;flex:none;letter-spacing:.3px;vertical-align:middle}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1d12;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;max-width:112px;background:none;border:0;color:var(--mut);font-size:12px;padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nav button.on{color:var(--ac)}
.nav i{font-style:normal;font-size:20px;line-height:1.2}
.sec{padding:12px 16px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600}
.mut{color:var(--mut)}
.sm{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 14px;background:var(--pan2);border:1px solid var(--line);cursor:pointer;font-weight:500;min-height:44px}
.btn.pri{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:600}
.btn.gold{background:var(--ac2);color:#2b2100;border-color:var(--ac2);font-weight:600}
.btn.red{background:#3a1515;border-color:#7f2a2a;color:#fecaca}
.btn.blk{display:flex;width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
input.in,textarea.in,select.in{width:100%;background:#0a1c11;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--ac)}
label.lb{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.hero{text-align:center;padding:34px 16px 14px}
.hero .ball{font-size:56px;line-height:1}
.hero h1{margin:8px 0 2px;font-size:26px;font-weight:700}
.hero p{margin:0;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--pan2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:600}
.seg{display:flex;background:#0a1c11;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--pan2);color:var(--tx);font-weight:600}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpick{display:flex;gap:8px;align-items:center;background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;min-height:58px}
.tpick.mine{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.tpick.taken{opacity:.55}
.tpick b{display:block;font-size:13px;line-height:1.25}
.tpick small{color:var(--mut);font-size:11px}
.stars{color:var(--ac2);font-size:11px;letter-spacing:-1px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.vs .side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.vs .side b{font-size:14px;line-height:1.2}
.vs .mid{font-size:28px;font-weight:700;min-width:90px}
.vs .mid small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600}
.fW{background:#166534;color:#bbf7d0}.fD{background:#4b5563;color:#e5e7eb}.fL{background:#7f1d1d;color:#fecaca}
.hl{display:flex;flex-direction:column;gap:6px}
.hu{display:flex;align-items:center;gap:8px;font-size:14px}
.res{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #1b3826;font-size:13px;cursor:pointer}
.res:last-child{border-bottom:0}
.res .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tn.r{text-align:right}
.res .sc{min-width:46px;text-align:center;font-weight:700;background:#0a1c11;border-radius:8px;padding:2px 4px}
.res.me{background:#12301f;border-radius:8px;padding-left:6px;padding-right:6px}
.news{font-size:13px;padding:6px 0;border-bottom:1px solid #1b3826}
.news:last-child{border-bottom:0}
.pitch{position:relative;border-radius:14px;padding:12px 6px;background:repeating-linear-gradient(180deg,#1d6b3a 0 36px,#1a6235 36px 72px);border:2px solid #2f8a50;overflow:hidden}
.pitch:before{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;border:2px solid rgba(255,255,255,.22);border-radius:50%;transform:translate(-50%,-50%)}
.pitch:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.22)}
.prow2{position:relative;z-index:1;display:flex;justify-content:space-evenly;margin:8px 0}
.slot{width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:none;border:0;padding:0}
.slot .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#f8fafc;color:#0b1f14;border:3px solid var(--ac);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.slot .c.mid{border-color:var(--ac2)}.slot .c.low{border-color:var(--bad)}
.slot .c.emp{background:rgba(0,0,0,.25);border:2px dashed rgba(255,255,255,.6);color:#fff}
.slot .c.oop{background:#fde68a}
.slot span{font-size:11px;color:#fff;text-shadow:0 1px 2px #000;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh{font-size:13px;color:var(--mut);margin:12px 0 4px;display:flex;justify-content:space-between}
.pl{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;background:var(--pan);border:1px solid var(--line);margin-bottom:5px}
.pl.in{border-color:#2e8b52;background:#11301f}
.pl .tog{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0a1c11;font-size:16px;cursor:pointer;flex:none}
.pl.in .tog{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:700}
.pl .pm{flex:1;min-width:0;cursor:pointer}
.pl .pm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pl .pm small{color:var(--mut);font-size:11px}
.pos{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:0 4px;margin-right:3px;vertical-align:1px}
.pGK{background:#854d0e;color:#fef08a}.pDF{background:#1e3a8a;color:#bfdbfe}.pMF{background:#14532d;color:#bbf7d0}.pFW{background:#7f1d1d;color:#fecaca}
.fx{font-size:10px;color:var(--blue)}
.ov{min-width:36px;text-align:center;font-weight:700;font-size:16px}
.fit{width:42px;height:6px;border-radius:3px;background:#0a1c11;overflow:hidden;flex:none}
.fit i{display:block;height:100%;background:var(--ac)}
.price{text-align:right;font-size:12px;white-space:nowrap}
.price b{display:block;color:var(--ac2);font-size:14px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{color:var(--mut);font-weight:400;font-size:11px;padding:4px 2px;text-align:center}
.tb td{padding:6px 2px;text-align:center;border-top:1px solid #1b3826}
.tb td.t{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tb tr.me td{background:#12301f}
.tb tr.hum td.t b{color:var(--ac)}
.tb td.pts{font-weight:700}
.zone1 td:first-child{box-shadow:3px 0 0 var(--ac) inset}
.zoneR td:first-child{box-shadow:3px 0 0 var(--bad) inset}
.live .clock{font-size:13px;color:var(--ac2);font-weight:600}
.feed{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ev{font-size:14px;padding:6px 8px;border-radius:8px;background:#0b1d12;display:flex;gap:8px}
.ev .m{color:var(--mut);min-width:28px;font-size:12px;padding-top:2px}
.ev.g{background:#173d25;font-weight:600}
.ev.r{background:#3b1717}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 0;border-bottom:1px solid #1b3826}
.mini:last-child{border-bottom:0}
.mini .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tn.r{text-align:right}
.mini .sc{min-width:40px;text-align:center;font-weight:700}
.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{background:#facc15;color:#2b2100}100%{background:transparent}}
.code{font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--ac2)}
.bar{height:8px;border-radius:4px;background:#0a1c11;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.stat b{min-width:28px;text-align:center}
.stat .bar{flex:1}
#modal .bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal .sh{background:var(--pan);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
#modal h2{margin:0 0 4px;font-size:19px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.kv div{background:#0a1c11;border-radius:10px;padding:8px;text-align:center}
.kv b{display:block;font-size:17px}
.kv small{color:var(--mut);font-size:11px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(30px);opacity:0;background:#111827;border:1px solid #374151;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:14px}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.champ{text-align:center;padding:18px 10px;background:radial-gradient(circle at 50% 0,#4d3b06,#0f2418 70%);border:1px solid #7a5f10}
.champ .tro{font-size:54px}
.warn{background:#3a2a07;border:1px solid #7a5f10;color:#fde68a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.foot{text-align:center;color:#4f7a5e;font-size:11px;padding:18px 0 6px}
.pl.bn{border-color:#6b5a12;background:#262110}
.pl .tog.tb{font-size:13px;width:34px}
.pl.bn .tog.tb{background:var(--ac2);color:#2b2100;border-color:var(--ac2);font-weight:700}
.bench{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{border:1px solid #6b5a12;background:#262110;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #1b3826;font-size:13px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lrow.btnrow{cursor:pointer;border-radius:8px;padding:10px 6px}
.lrow.btnrow:active{background:var(--pan2)}
.lrow.dead{opacity:.45;text-decoration:line-through}
.ev.sb{background:#13263a}
.ctl{border-color:#2e8b52}
.mini{cursor:pointer}.mini.me{background:#12301f;border-radius:6px}
code{background:#0a1c11;padding:1px 5px;border-radius:5px}
</style>
</head>

<div id="modal"></div>
<div id="toast"></div>

  T.xi=xi;T.bn=[];fixBench(T);
}
function fixXI(T){
  const sl=slotsOf(T.form);const used=new Set();
  const xi=sl.map((_,i)=>{const id=T.xi[i];const p=S.pl[id];if(p&&p.t===T.id&&avail(p)&&!used.has(id)){used.add(id);return id}return null});
  const pool=squad(T.id).filter(p=>avail(p)&&!used.has(p.id)).sort((a,b)=>effScore(b)-effScore(a));
  const bnIds=new Set(T.bn||[]);pool.sort((a,b)=>(bnIds.has(a.id)?0:1)-(bnIds.has(b.id)?0:1)||effScore(b)-effScore(a));
  sl.forEach((pos,i)=>{if(xi[i]==null&&pool.length){let k=pool.findIndex(q=>q.pos===pos);if(k<0)k=pool.findIndex(q=>(pos==='GK')===(q.pos==='GK'));if(k<0)k=0;xi[i]=pool[k].id;pool.splice(k,1)}});

function fixBench(T){

  T.bn=(T.bn||[]).filter(id=>{const p=S.pl[id];if(!p||p.t!==T.id||!avail(p)||inXI.has(id)||seen.has(id))return false;seen.add(id);return true}).slice(0,BENCH);
  const pool=squad(T.id).filter(p=>avail(p)&&!inXI.has(p.id)&&!seen.has(p.id)).sort((a,b)=>effScore(b)-effScore(a));
  if(!T.bn.some(id=>S.pl[id].pos==='GK')){const g=pool.find(p=>p.pos==='GK');if(g&&T.bn.length<BENCH){T.bn.push(g.id);seen.add(g.id)}}
  ['DF','MF','FW'].forEach(pos=>{if(T.bn.length<BENCH&&!T.bn.some(id=>S.pl[id].pos===pos)){const q=pool.find(p=>p.pos===pos&&!seen.has(p.id));if(q){T.bn.push(q.id);seen.add(q.id)}}});
  for(const p of pool){if(T.bn.length>=BENCH)break;if(!seen.has(p.id)&&p.pos!=='GK'){T.bn.push(p.id);seen.add(p.id)}}
}
function reslot(on,form,out){
  // จัดผู้เล่นที่อยู่ในสนามเข้าช่องตามแผนใหม่
  const sl=slotsOf(form);const ids=on.filter(Boolean);const res=sl.map(()=>null);const used=new Set();
  const live=ids.filter(id=>!out.includes(id)),dead=ids.filter(id=>out.includes(id));
  sl.forEach((pos,i)=>{const id=live.find(x=>!used.has(x)&&S.pl[x].pos===pos);if(id){res[i]=id;used.add(id)}});
  sl.forEach((pos,i)=>{if(res[i]==null){const id=live.find(x=>!used.has(x)&&(pos==='GK')===(S.pl[x].pos==='GK'))||live.find(x=>!used.has(x));if(id){res[i]=id;used.add(id)}}});
  sl.forEach((pos,i)=>{if(res[i]==null){const id=dead.find(x=>!used.has(x));if(id){res[i]=id;used.add(id)}}});
  return res;
}

const active=(m,s)=>m.on[s].filter(id=>id&&!m.out.includes(id));

function stepMinute(m,min){

function applyRound(ms){
  const played=new Map();ms.forEach(m=>m.pl.forEach(id=>played.set(id,m.mp[id]||0)));
  const c=L();
  Object.values(S.pl).forEach(p=>{
    const pl=played.has(p.id);
    if(p.ij>0&&!pl)p.ij--;if(p.sp>0&&!pl)p.sp--;
    p.ft=Math.min(100,p.ft+14);
    if(pl){const mins=played.get(p.id);if(mins>=1)p.ap++;p.ft=Math.max(35,Math.round(p.ft-mins*0.21-rnd()*3))}
    let ch=0;
    if(p.ag<=21){if(p.o<p.pt&&rnd()<(pl?0.16:0.07))ch=1}else if(p.ag<=25){if(p.o<p.pt&&rnd()<(pl?0.09:0.03))ch=1}
    else if(p.ag>=33){if(rnd()<0.06)ch=-1}else if(p.ag>=30){if(rnd()<0.03)ch=-1}
    p.o=clamp(p.o+ch,35,94);p.v=valueOf(p);
  });
  ms.forEach(m=>{
    m.gs.forEach(id=>{if(S.pl[id])S.pl[id].g++});m.as.forEach(id=>{if(S.pl[id])S.pl[id].as++});
    m.inj.forEach(id=>{const p=S.pl[id];if(p){p.ij=ri(1,4);const T=S.teams[p.t];if(T&&T.owner)addNews('🚑 '+p.n+' ('+T.sh+') บาดเจ็บ พัก '+p.ij+' นัด')}});
    m.red.forEach(id=>{const p=S.pl[id];if(p)p.sp=1});
    const H=S.teams[m.h];H.budget=r1(H.budget+c.gate(H.rep));
  });
  S.teams.forEach(T=>{T.budget=r1(T.budget+c.tv-squad(T.id).reduce((s,p)=>s+p.v,0)*c.wage)});
  aiMarket();
}
function aiMarket(){
  S.teams.forEach(T=>{
    if(T.owner)return;const sq=squad(T.id);
    if(sq.length>27){const w=sq.sort((a,b)=>a.o-b.o)[0];w.t=-1;T.budget=r1(T.budget+w.v*0.7);return}

}

let tickT=null,playTimer=null,endT=null;
function startRound(){

  Object.values(S.humans).forEach(h=>h.ready=false);
  S.phase='live';bump();runTicker();
}
function runTicker(){clearInterval(tickT);tickT=setInterval(tick,SPEED[S.spd||1].t)}
function tick(force){
  const V=S&&S.lv;if(!V||S.phase!=='live'){clearInterval(tickT);return}
  const now=Date.now();
  if(!force){
    if(V.st==='pause'){if(now<V.pu.until)return;V.st='run';V.pu=null;liveSend([]);return}
    if(V.st==='ht'){if(now<V.htu)return;V.st='run';liveSend([]);return}
  }
  if(V.st==='ft')return;
  V.min++;const d=[];
  V.ms.forEach((m,i)=>{const n0=m.ev.length;
    if(V.min===46)m.ev.push({m:45,s:-1,k:'ht',x:'⏸️ หมดครึ่งแรก '+m.sc[0]+'-'+m.sc[1]});
    stepMinute(m,V.min);aiMatch(m,V.min);
    if(V.min>=93)m.ev.push({m:93,s:-1,k:'ft',x:'🏁 จบเกม '+S.teams[m.h].name+' '+m.sc[0]+'-'+m.sc[1]+' '+S.teams[m.a].name});
    d.push(i,n0)});
  if(V.min===45&&!force){V.st='ht';V.htu=now+SPEED[S.spd||1].ht}
  if(V.min>=93){finishRound();return}
  if(!force)liveSend(d);
}
function finishRound(){
  const V=S.lv;clearInterval(tickT);V.st='ft';V.min=93;
  const r=V.r;
  S.res[r]=V.ms.map(m=>({h:m.h,a:m.a,hg:m.sc[0],ag:m.sc[1]}));
  S.last={r,m:V.ms.map(m=>{const pm=m.mid[0]*m.mid[0],qm=m.mid[1]*m.mid[1];const ps=clamp(Math.round(pm/(pm+qm||1)*100+(rnd()*6-3)),28,72);
    return{h:m.h,a:m.a,hg:m.sc[0],ag:m.sc[1],ev:m.ev.filter(e=>['g','r','i','y','sub'].includes(e.k)),ps:[ps,100-ps],sh:m.sh,ot:m.ot,cd:m.cd}})};
  applyRound(V.ms);
  bump();
  clearTimeout(endT);endT=setTimeout(endLive,5000);
}
function skipAll(){if(!S||S.phase!=='live'||!S.lv)return;clearInterval(tickT);while(S.lv&&S.lv.st!=='ft')tick(true);}
function endLive(){
  if(!S||S.phase!=='live')return;clearTimeout(endT);clearInterval(tickT);
  if(S.lv&&S.lv.st!=='ft'){skipAll()}
  S.lv=null;S.round++;
  if(S.round>=nR())seasonEnd();else S.phase='pre';
  bump();
}
function liveSend(d){
  const V=S.lv;if(!V)return;
  const pk={t:'l',id:V.id,min:V.min,st:V.st,pu:V.pu,htu:V.htu,tu:V.tu,now:Date.now(),d:[]};
  for(let k=0;k<d.length;k+=2){const i=d[k],n0=d[k+1],m=V.ms[i];pk.d.push({i,n:m.ev.length,e:m.ev.slice(n0),sc:m.sc,sh:m.sh,ot:m.ot,cd:m.cd,on:m.on,bn:m.bn,sb:m.sb,out:m.out,inj:m.inj,mp:m.mp,tc:m.tc})}
  if(isHost){for(const c of conns.keys())if(c.open)try{c.send(pk)}catch(e){}}
  render();
}
function checkReady(){
  if(!S||S.phase!=='pre')return;
  const hs=Object.values(S.humans).filter(h=>h.team!=null&&h.on);
  if(hs.length&&hs.every(h=>h.ready)){clearTimeout(playTimer);playTimer=setTimeout(startRound,1200)}else clearTimeout(playTimer);
}

/* ---------------- คำสั่งจากผู้เล่น (รันบนโฮสต์) ---------------- */
function teamOf(u){const h=S.humans[u];return h&&h.team!=null?S.teams[h.team]:null}
function myLive(T){if(!S.lv||!T)return null;const i=S.lv.ms.findIndex(m=>m.h===T.id||m.a===T.id);if(i<0)return null;const m=S.lv.ms[i];return{m,i,s:m.h===T.id?0:1}}
function act(u,m){
  if(!S||!m||typeof m!=='object')return;
  const isH=u===S.host,h=S.humans[u],T=teamOf(u);
  switch(m.type){
    case 'hello':{const n=String(m.name||'ผู้จัดการ').trim().slice(0,16)||'ผู้จัดการ';
      if(!h){if(Object.keys(S.humans).length>=24)return'ห้องเต็มแล้ว';S.humans[u]={name:n,team:null,ready:false,on:true}}else{h.name=n;h.on=true}break}
    case 'league':{if(!isH||S.phase!=='lobby'||!LG[m.lg])return;const keep=S.humans,code=S.code,solo=S.solo,spd=S.spd;newGame(code,solo,m.lg,keep);S.spd=spd;break}
    case 'speed':{if(!isH)return;S.spd=clamp(+m.v|0,0,2);if(S.phase==='live')runTicker();break}
    case 'pick':{if(!h)return;const X=S.teams[+m.team];if(!X)return;if(S.phase==='live')return'รอให้จบนัดนี้ก่อน';
      if(X.owner&&X.owner!==u)return'ทีมนี้มีคนคุมแล้ว';if(T&&T!==X)T.owner=null;X.owner=u;h.team=X.id;h.ready=false;
      if(S.phase!=='lobby')addNews('👔 '+h.name+' เข้ารับตำแหน่งผู้จัดการ '+X.name);break}
    case 'unpick':{if(T){T.owner=null;h.team=null;h.ready=false}break}
    case 'lineup':{if(!T||S.phase==='live')return;if(m.form&&FORMS[m.form])T.form=m.form;if([0,1,2].includes(m.tac))T.tac=m.tac;
      const own=id=>{const p=S.pl[id];return p&&p.t===T.id};const seen=new Set();
      if(Array.isArray(m.xi))T.xi=slotsOf(T.form).map((_,i)=>{const id=m.xi[i];if(own(id)&&!seen.has(id)){seen.add(id);return id}return null});
      if(Array.isArray(m.bn))T.bn=m.bn.filter(id=>own(id)&&!seen.has(id)&&(seen.add(id),true)).slice(0,BENCH);
      break}
    case 'auto':{if(!T||S.phase==='live')return;autoXI(T);break}
    case 'ready':{if(!T||S.phase!=='pre')return;h.ready=!!m.v;break}
    case 'buy':{if(!T)return;if(S.phase==='live')return'ซื้อขายได้หลังจบนัด';const p=S.pl[m.pid];if(!p)return'ไม่พบนักเตะ';if(p.t===T.id)return;
      const seller=p.t>=0?S.teams[p.t]:null;if(seller&&seller.owner)return'ซื้อจากทีมของเพื่อนไม่ได้';
      if(seller&&squad(seller.id).length<=18)return seller.name+' ไม่ยอมปล่อยตัว (ผู้เล่นไม่พอ)';
      if(squad(T.id).length>=MAX_SQUAD)return'ทีมเต็ม '+MAX_SQUAD+' คนแล้ว';
      const price=priceOf(p);if(T.budget<price)return'งบไม่พอ';
      T.budget=r1(T.budget-price);if(seller){seller.budget=r1(seller.budget+price);seller.xi=seller.xi.map(x=>x===p.id?null:x);seller.bn=seller.bn.filter(x=>x!==p.id);fixXI(seller);fixBench(seller)}
      p.t=T.id;addNews('✍️ '+T.name+' ซื้อ '+p.n+' ('+p.pos+' '+p.o+') '+money(price));break}
    case 'sell':{if(!T)return;if(S.phase==='live')return'ซื้อขายได้หลังจบนัด';const p=S.pl[m.pid];if(!p||p.t!==T.id)return;
      if(squad(T.id).length<=MIN_SQUAD)return'ต้องมีนักเตะอย่างน้อย '+MIN_SQUAD+' คน';
      const g=r1(p.v*0.75);T.budget=r1(T.budget+g);p.t=-1;T.xi=T.xi.map(x=>x===p.id?null:x);T.bn=T.bn.filter(x=>x!==p.id);
      addNews('💸 '+T.name+' ขาย '+p.n+' ได้ '+money(g));break}
    case 'rename':{const p=S.pl[m.pid];if(!p)return;if(!(isH||(T&&p.t===T.id)))return'เปลี่ยนชื่อได้เฉพาะนักเตะทีมตัวเอง';
      const n=String(m.n||'').replace(/\s+/g,' ').trim().slice(0,28);if(!n)return;p.n=n;p.cu=1;break}
    case 'bulk':{if(!T)return;const r=bulkRename(T,String(m.txt||''));bump();return r.msg}
    case 'start':{if(!isH||S.phase!=='lobby')return;S.phase='pre';addNews('📣 ฤดูกาล '+seasonLabel(S.season)+' เริ่มแล้ว! ผู้จัดการ: '+Object.values(S.humans).filter(x=>x.team!=null).map(x=>x.name).join(', '));break}
    case 'play':{if(!isH)return;startRound();return}
    case 'skiplive':{if(!isH)return;skipAll();return}
    case 'newseason':{if(!isH||S.phase!=='end')return;newSeason();break}
    /* ---- ระหว่างแข่ง ---- */
    case 'ltac':{const L_=myLive(T);if(!L_||S.lv.st==='ft')return;const v=+m.v;if(![0,1,2].includes(v)||T.tac===v)return;T.tac=v;L_.m.tc[L_.s]=v;
      L_.m.ev.push({m:S.lv.min,s:L_.s,k:'tac',x:'📋 '+T.name+' เปลี่ยนแท็กติกเป็น “'+TAC[v]+'”'});break}
    case 'lform':{const L_=myLive(T);if(!L_||S.lv.st==='ft'||!FORMS[m.f]||T.form===m.f)return;T.form=m.f;
      L_.m.sl[L_.s]=slotsOf(m.f);L_.m.on[L_.s]=reslot(L_.m.on[L_.s],m.f,L_.m.out);
      L_.m.ev.push({m:S.lv.min,s:L_.s,k:'tac',x:'📋 '+T.name+' เปลี่ยนแผนเป็น '+m.f});break}
    case 'sub':{const L_=myLive(T);if(!L_)return;const M=L_.m,s=L_.s;if(S.lv.st==='ft')return'จบเกมแล้ว';
      if(M.sb[s]>=MAX_SUBS)return'เปลี่ยนตัวครบ '+MAX_SUBS+' คนแล้ว';
      if(!M.on[s].includes(m.off)||M.out.includes(m.off))return'ผู้เล่นคนนี้ไม่ได้อยู่ในสนาม';
      if(!M.bn[s].includes(m.on))return'ไม่มีผู้เล่นคนนี้บนม้านั่งสำรอง';
      doSub(M,s,m.off,m.on,'');break}
    case 'pause':{if(!S.lv||!T||S.lv.st!=='run')return;const n=S.lv.tu[u]||0;if(n>=TIMEOUTS)return'ใช้สิทธิ์ขอเวลานอกครบแล้ว';
      S.lv.tu[u]=n+1;S.lv.st='pause';S.lv.pu={by:h.name,u,until:Date.now()+PAUSE_MS};
      const L_=myLive(T);if(L_)L_.m.ev.push({m:S.lv.min,s:L_.s,k:'tac',x:'⏸️ '+h.name+' ('+T.sh+') ขอเวลานอก'});break}
    case 'resume':{if(!S.lv||S.lv.st!=='pause')return;if(!(isH||S.lv.pu.u===u))return'เฉพาะคนที่ขอเวลานอกหรือเจ้าของห้อง';S.lv.pu.until=Date.now();break}
    default:return;
  }
  bump();checkReady();
}
function priceOf(p){return p.t>=0?r1(p.v*1.3):r1(p.v)}
function bulkRename(T,txt){
  const map={gk:'GK',df:'DF',mf:'MF',fw:'FW','ผู้รักษาประตู':'GK','ประตู':'GK','กองหลัง':'DF','กองกลาง':'MF','กองหน้า':'FW'};const order={GK:0,DF:1,MF:2,FW:3};
  const sq=squad(T.id).sort((a,b)=>order[a.pos]-order[b.pos]||b.o-a.o);const used=new Set();let n=0,skip=0;
  txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let pos=null,name=line.replace(/^\d+[\s.)\-]*/,'');const mm=name.match(/^(GK|DF|MF|FW|ผู้รักษาประตู|ประตู|กองหลัง|กองกลาง|กองหน้า)[\s:.\-]+/i);
    if(mm){pos=map[mm[1].toLowerCase()]||map[mm[1]];name=name.slice(mm[0].length)}
    name=name.replace(/\s+/g,' ').trim().slice(0,28);if(!name){skip++;return}
    const p=sq.find(q=>!used.has(q.id)&&(!pos||q.pos===pos));if(!p){skip++;return}used.add(p.id);p.n=name;p.cu=1;n++});
  return{msg:'เปลี่ยนชื่อแล้ว '+n+' คน'+(skip?' (ข้าม '+skip+' บรรทัด)':'')};
}

let isHost=false,peer=null,conn=null,netOk=false,clockOff=0,retryT=null,leaving=false,joinCode=null;
const conns=new Map();
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[ri(0,c.length-1)];return s}
let bcT=null,saveT=null;
function bump(){
  if(!S)return;S.seq++;
  if(isHost){clearTimeout(bcT);bcT=setTimeout(broadcast,40);clearTimeout(saveT);saveT=setTimeout(saveGame,400)}
  render();
}
function saveGame(){if(isHost&&S)LS.set(SAVE_KEY,JSON.stringify(S))}
function broadcast(){if(!isHost||!S)return;const msg={t:'s',s:S,now:Date.now()};for(const c of conns.keys())if(c.open)try{c.send(msg)}catch(e){}}
function send(m){
  if(isHost){const err=act(uid,m);if(err)toast(err);return}
  if(conn&&conn.open){try{conn.send({t:'a',u:uid,m})}catch(e){toast('ส่งไม่สำเร็จ')}}else toast('กำลังเชื่อมต่อใหม่...');
}
function hostStart(solo,lg){isHost=true;leaving=false;newGame(solo?'SOLO':genCode(),solo,lg||'th');act(uid,{type:'hello',name:myName});if(!solo)openHostPeer(0);UI.tab='home';bump()}
function resumeHost(){
  try{S=JSON.parse(LS.get(SAVE_KEY,'null'))}catch(e){S=null}
  if(!S||S.v!==VER){S=null;toast('ไม่พบเกมที่บันทึกไว้');return}
  isHost=true;leaving=false;S.host=uid;Object.values(S.humans).forEach(h=>h.on=false);
  if(S.humans[uid])S.humans[uid].on=true;else act(uid,{type:'hello',name:myName});
  if(S.phase==='live'){if(!S.lv)S.phase='pre';else if(S.lv.st==='ft'){S.lv.st='run';endLive()}else{S.lv.st='run';S.lv.pu=null;runTicker()}}
  if(!S.solo)openHostPeer(0);UI.tab='home';bump();
}
function openHostPeer(tries){
  if(typeof Peer==='undefined'){netOk=false;toast('โหลดระบบออนไลน์ไม่ได้ — เล่นคนเดียวได้ปกติ');return}
  try{if(peer)peer.destroy()}catch(e){}
  peer=new Peer(PREFIX+S.code,PEER_OPTS);
  peer.on('open',()=>{netOk=true;render()});
  peer.on('connection',c=>{c.on('data',d=>hostData(c,d));c.on('close',()=>hostClose(c));c.on('error',()=>hostClose(c))});
  peer.on('disconnected',()=>{netOk=false;render();if(!leaving)setTimeout(()=>{try{peer&&!peer.destroyed&&peer.reconnect()}catch(e){}},1500)});
  peer.on('error',e=>{netOk=false;render();if(leaving)return;
    if(e.type==='unavailable-id'){if(tries<12)setTimeout(()=>openHostPeer(tries+1),4000);else toast('รหัสห้องถูกใช้อยู่ ลองสร้างห้องใหม่')}
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type))setTimeout(()=>openHostPeer(tries+1),4000)});
}
function hostData(c,d){
  if(!d||d.t!=='a'||!S)return;const u=String(d.u||'').slice(0,24);if(!u)return;
  if(d.m&&d.m.type==='hello'){for(const [cc,uu] of conns)if(uu===u&&cc!==c){conns.delete(cc);try{cc.close()}catch(e){}}conns.set(c,u)}
  if(conns.get(c)!==u)return;
  const err=act(u,d.m);if(err)try{c.send({t:'err',m:err})}catch(e){}
  if(d.m&&d.m.type==='hello')try{c.send({t:'s',s:S,now:Date.now()})}catch(e){}
}
function hostClose(c){const u=conns.get(c);conns.delete(c);if(u&&S&&S.humans[u]&&![...conns.values()].includes(u)){S.humans[u].on=false;S.humans[u].ready=false;bump();checkReady()}}
function joinRoom(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4){toast('ใส่รหัสห้องให้ถูกต้อง');return}
  if(typeof Peer==='undefined'){toast('โหลดระบบออนไลน์ไม่ได้ ลองรีเฟรช');return}
  isHost=false;leaving=false;LS.set('fm_last',code);joinCode=code;UI.tab='home';connectClient();render();
}
function connectClient(){
  clearTimeout(retryT);try{if(peer)peer.destroy()}catch(e){}
  netOk=false;peer=new Peer(PEER_OPTS);
  peer.on('open',()=>{conn=peer.connect(PREFIX+joinCode,{reliable:true});
    conn.on('open',()=>{netOk=true;conn.send({t:'a',u:uid,m:{type:'hello',name:myName}});render()});
    conn.on('data',onClientData);conn.on('close',lost);conn.on('error',lost)});
  peer.on('error',e=>{if(leaving)return;if(e.type==='peer-unavailable'&&!S){toast('ไม่พบห้อง '+joinCode+' (เจ้าของห้องอาจออฟไลน์)');goHome();return}lost()});
}
function lost(){if(leaving||isHost)return;netOk=false;render();clearTimeout(retryT);retryT=setTimeout(connectClient,3000)}
function onClientData(d){
  if(!d)return;
  if(d.t==='s'){const prev=S&&S.lv&&S.lv.id;S=d.s;clockOff=d.now-Date.now();if(S.lv&&S.lv.id!==prev){UI.tab='home';UI.liveSel=null}render()}
  else if(d.t==='l'){if(!S||!S.lv||S.lv.id!==d.id)return;const V=S.lv;clockOff=d.now-Date.now();
    Object.assign(V,{min:d.min,st:d.st,pu:d.pu,htu:d.htu,tu:d.tu});
    d.d.forEach(x=>{const m=V.ms[x.i];if(!m)return;if(m.ev.length+x.e.length===x.n)m.ev.push(...x.e);
      Object.assign(m,{sc:x.sc,sh:x.sh,ot:x.ot,cd:x.cd,on:x.on,bn:x.bn,sb:x.sb,out:x.out,inj:x.inj,mp:x.mp,tc:x.tc})});
    render()}
  else if(d.t==='err')toast(d.m);
}
function goHome(){
  if(isHost)saveGame();
  leaving=true;clearTimeout(retryT);clearInterval(tickT);clearTimeout(endT);clearTimeout(playTimer);
  try{if(peer)peer.destroy()}catch(e){}peer=null;conn=null;conns.clear();S=null;isHost=false;netOk=false;closeModal();render();
}

function togglePlayer(pid){
  const T=myTeam();if(!T)return;const p=S.pl[pid];if(!p)return;const sl=slotsOf(T.form);const at=T.xi.indexOf(pid);
  if(at>=0){lineupChange(X=>{X.xi[at]=null});return}
  if(!avail(p)){toast(p.ij?'บาดเจ็บอยู่':'ติดโทษแบน');return}
  let i=sl.findIndex((s,k)=>s===p.pos&&!S.pl[T.xi[k]]);
  if(i<0){let wo=999;sl.forEach((s,k)=>{if(s===p.pos){const q=S.pl[T.xi[k]];const sc=q?effScore(q):-1;if(sc<wo){wo=sc;i=k}}})}
  if(i<0)i=sl.findIndex((s,k)=>!S.pl[T.xi[k]]&&(s==='GK')===(p.pos==='GK'));
  if(i<0){toast('ไม่มีตำแหน่งว่าง');return}
  lineupChange(X=>{const old=X.xi[i];const bi=X.bn.indexOf(pid);X.xi[i]=pid;
    if(bi>=0){if(old)X.bn[bi]=old;else X.bn.splice(bi,1)}});

function toggleBench(pid){
  const T=myTeam();if(!T)return;const p=S.pl[pid];if(!p)return;
  if(T.bn.includes(pid)){lineupChange(X=>{X.bn=X.bn.filter(x=>x!==pid)});return}
  if(!avail(p)){toast(p.ij?'บาดเจ็บอยู่':'ติดโทษแบน');return}
  if(T.bn.length>=BENCH){toast('ม้านั่งสำรองเต็ม '+BENCH+' คนแล้ว');return}
  lineupChange(X=>{const at=X.xi.indexOf(pid);if(at>=0)X.xi[at]=null;X.bn.push(pid)});

  const m=S.last.m[i];const H=S.teams[m.h],A=S.teams[m.a];
  const st=(l,a,b)=>'<div class="stat"><b>'+a+'</b><div class="bar"><i style="width:'+(a+b?a/(a+b)*100:50)+'%;background:'+H.c1+'"></i><i style="flex:1;background:'+A.c1+'"></i></div><b>'+b+'</b></div><div class="mut sm" style="text-align:center;margin-top:-4px">'+l+'</div>';
  openModal('<div class="vs"><div class="side">'+badge(H,44)+'<b>'+esc(H.name)+'</b></div><div class="mid">'+m.hg+' - '+m.ag+'<small>จบเกม</small></div><div class="side">'+badge(A,44)+'<b>'+esc(A.name)+'</b></div></div>'+
   st('ครองบอล %',m.ps[0],m.ps[1])+st('ยิง',m.sh[0],m.sh[1])+st('ยิงตรงกรอบ',m.ot[0],m.ot[1])+st('ใบเหลือง/แดง',m.cd[0],m.cd[1])+
   '<h3 style="margin:12px 0 6px">เหตุการณ์สำคัญ</h3>'+(m.ev.map(evHtml).join('')||'<div class="mut">ไม่มีเหตุการณ์สำคัญ</div>')+
   '<button class="btn blk" style="margin-top:12px" data-a="close">ปิด</button>');
}
function showBulk(){
  if(!myTeam())return;
  openModal('<h2>📝 แก้ชื่อนักเตะหลายคน</h2><p class="mut sm">วางรายชื่อ 1 คนต่อบรรทัด ใส่ตำแหน่งนำหน้าได้ (GK / DF / MF / FW) เช่น<br><code>GK ชื่อ นามสกุล</code><br>ถ้าไม่ใส่ตำแหน่ง จะไล่ใส่ตามลำดับ ผู้รักษาประตู → กองหลัง → กองกลาง → กองหน้า (เรียงจากคนเก่งสุด)</p>'+
   '<textarea class="in" id="bk" rows="10" placeholder="GK ชื่อ นามสกุล&#10;DF ชื่อ นามสกุล"></textarea>'+
   '<button class="btn pri blk" style="margin-top:10px" data-a="dobulk">บันทึกรายชื่อ</button><button class="btn blk" style="margin-top:8px" data-a="close">ยกเลิก</button>');
}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
async function shareLink(link){
  const text='มาเล่นเกมผู้จัดการทีม'+L().name+'ด้วยกัน! รหัสห้อง '+S.code;
  if(navigator.share){try{await navigator.share({title:'KG ผู้จัดการทีม',text,url:link});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyText(link);
}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),()=>prompt('คัดลอกลิงก์นี้',t));else prompt('คัดลอกลิงก์นี้',t)}
function saveName(){const el=$('#nm');if(el){myName=el.value.trim().slice(0,16);LS.set('fm_name',myName)}return myName}

/* ---------- Events ---------- */
const A={
  slg(d){UI.lg=d.v;LS.set('fm_lg',d.v);saveName();render()},
  hlg(d){send({type:'league',lg:d.v})},
  speed(d){send({type:'speed',v:+d.v})},
  create(){if(!saveName()){toast('ใส่ชื่อก่อนนะ');$('#nm').focus();return}hostStart(false,UI.lg)},
  solo(){if(!saveName())myName='ผู้จัดการ';hostStart(true,UI.lg)},
  resume(){saveName();if(!myName)myName='ผู้จัดการ';resumeHost()},
  join(d){if(!saveName()){toast('ใส่ชื่อก่อนนะ');$('#nm').focus();return}joinRoom(d.v||($('#jc')&&$('#jc').value))},
  leave(){if(isHost&&S&&!S.solo&&!confirm('ออกจากห้อง? เพื่อนจะหลุดจากเกม (เกมยังถูกบันทึกในเครื่องนี้)'))return;goHome()},
  tab(d){UI.tab=d.v;render();window.scrollTo(0,0)},
  pick(d){send({type:'pick',team:+d.v})},
  start(){send({type:'start'})},
  ready(d){send({type:'ready',v:d.v==='1'});if(!isHost&&me()){me().ready=d.v==='1';render()}},
  play(){send({type:'play'})},
  skiplive(){send({type:'skiplive'})},
  skip(){if(S.lv)UI.skip[S.lv.id]=1;render()},
  unskip(){if(S.lv)delete UI.skip[S.lv.id];UI.tab='home';render();window.scrollTo(0,0)},
  liveidx(d){UI.liveSel={id:S.lv.id,i:+d.v};render();window.scrollTo(0,0)},
  newseason(){send({type:'newseason'})},
  form(d){lineupChange(X=>{X.form=d.v;autoXI(X)})},
  tac(d){lineupChange(X=>{X.tac=+d.v})},
  auto(){lineupChange(X=>autoXI(X))},
  tog(d){togglePlayer(+d.v)},bench(d){toggleBench(+d.v)},
  unbench(d){lineupChange(X=>{X.bn=X.bn.filter(x=>x!==+d.v)})},
  unslot(d){lineupChange(X=>{X.xi[+d.v]=null})},
  slotpick(d){const T=myTeam();toast('เลือก'+POSN[slotsOf(T.form)[+d.v]]+'จากรายชื่อด้านล่าง')},
  pl(d){showPlayer(+d.v)},match(d){showMatch(+d.v)},
  mksrc(d){UI.mkSrc=d.v;render()},mkpos(d){UI.mkPos=d.v;render()},mksort(d){UI.mkSort=d.v;render()},
  buy(d){send({type:'buy',pid:+d.v});closeModal()},
  sell(d){if(!confirm('ขายนักเตะคนนี้?'))return;send({type:'sell',pid:+d.v});closeModal()},
  rename(d){const v=$('#rn').value;send({type:'rename',pid:+d.v,n:v});if(!isHost&&S.pl[+d.v]){S.pl[+d.v].n=v.trim()||S.pl[+d.v].n;S.pl[+d.v].cu=1;render()}closeModal();toast('บันทึกชื่อแล้ว')},
  bulk(){showBulk()},
  dobulk(){send({type:'bulk',txt:$('#bk').value});closeModal();if(!isHost)toast('ส่งรายชื่อแล้ว')},
  tbl(d){UI.tbl=d.v;render()},fxr(d){UI.fxR=+d.v;render()},
  share(d){shareLink(d.v)},copy(d){copyText(d.v)},
  snd(){UI.sound=!UI.sound;LS.set('fm_snd',UI.sound?'1':'0');if(UI.sound)beep(true);render()},
  /* live */
  ltac(d){send({type:'ltac',v:+d.v});const T=myTeam();if(!isHost&&T){T.tac=+d.v;render()}},
  lform(d){send({type:'lform',f:d.v})},
  pause(){send({type:'pause'})},resume(){send({type:'resume'})},
  subopen(){UI.subOpen=true;UI.subOff=null;drawSub()},
  suboff(d){UI.subOff=+d.v;drawSub()},suback(){UI.subOff=null;drawSub()},
  subon(d){send({type:'sub',off:UI.subOff,on:+d.v});UI.subOff=null;const T=myTeam(),mine=myLive(T);
    if(mine&&MAX_SUBS-mine.m.sb[mine.s]<=1){closeModal()}else drawSub()},
  subclose(){closeModal()},
  close(){closeModal()},
  closebg(d,el,e){if(e.target===el)closeModal()}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(!f||el.disabled)return;f(el.dataset,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='jc')A.join({})});
document.addEventListener('input',e=>{if(e.target.id==='mkq'){UI.mkQ=e.target.value;clearTimeout(UI.mqT);UI.mqT=setTimeout(()=>{render();setTimeout(()=>{const el=$('#mkq');if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},20)},350)}});
setInterval(()=>{if(S&&S.lv&&(S.lv.st==='pause'||S.lv.st==='ht')&&UI.tab==='home')render()},1000);
window.addEventListener('pagehide',saveGame);
render();
window.__fm={get S(){return S},startRound,skipAll,endLive,tick,act:m=>act(uid,m),uid:()=>uid};

</script>
</body>
