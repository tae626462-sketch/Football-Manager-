<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1d12">
<meta name="description" content="เกมผู้จัดการทีมฟุตบอลพรีเมียร์ลีก คุมทีมจริง แก้เกมสดระหว่างแข่ง">
<title>KG ผู้จัดการทีม</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KG Manager">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#07140d;--pan:#0f2418;--pan2:#163222;--line:#244a33;--tx:#ecf7ef;--mut:#8db59a;--ac:#22c55e;--ac2:#facc15;--bad:#f87171;--blue:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Kanit,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#0d2a19,#0a1f13);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.top .tt small{color:var(--mut);font-size:12px}
.money{font-weight:600;color:var(--ac2);text-align:right;font-size:14px;white-space:nowrap}
.money small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:4px;vertical-align:middle}
.dot.off{background:var(--bad)}
.badge{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;border:2px solid;flex:none;letter-spacing:.3px;vertical-align:middle}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1d12;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;max-width:112px;background:none;border:0;color:var(--mut);font-size:12px;padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nav button.on{color:var(--ac)}
.nav i{font-style:normal;font-size:20px;line-height:1.2}
.sec{padding:12px 16px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600}
.mut{color:var(--mut)}
.sm{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 14px;background:var(--pan2);border:1px solid var(--line);cursor:pointer;font-weight:500;min-height:44px}
.btn.pri{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:600}
.btn.gold{background:var(--ac2);color:#2b2100;border-color:var(--ac2);font-weight:600}
.btn.red{background:#3a1515;border-color:#7f2a2a;color:#fecaca}
.btn.blk{display:flex;width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
input.in,textarea.in,select.in{width:100%;background:#0a1c11;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}
input.in:focus,textarea.in:focus{border-color:var(--ac)}
label.lb{display:block;font-size:13px;color:var(--mut);margin:0 0 4px}
.hero{text-align:center;padding:34px 16px 14px}
.hero .ball{font-size:56px;line-height:1}
.hero h1{margin:8px 0 2px;font-size:26px;font-weight:700}
.hero p{margin:0;color:var(--mut)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--pan2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:600}
.seg{display:flex;background:#0a1c11;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:13px;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--pan2);color:var(--tx);font-weight:600}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpick{display:flex;gap:8px;align-items:center;background:var(--pan2);border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;text-align:left;min-height:58px}
.tpick.mine{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac) inset}
.tpick.taken{opacity:.55}
.tpick b{display:block;font-size:13px;line-height:1.25}
.tpick small{color:var(--mut);font-size:11px}
.stars{color:var(--ac2);font-size:11px;letter-spacing:-1px}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.vs .side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.vs .side b{font-size:14px;line-height:1.2}
.vs .mid{font-size:28px;font-weight:700;min-width:90px}
.vs .mid small{display:block;font-size:12px;color:var(--mut);font-weight:400}
.form{display:inline-flex;gap:3px}
.form i{font-style:normal;width:18px;height:18px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:600}
.fW{background:#166534;color:#bbf7d0}.fD{background:#4b5563;color:#e5e7eb}.fL{background:#7f1d1d;color:#fecaca}
.hl{display:flex;flex-direction:column;gap:6px}
.hu{display:flex;align-items:center;gap:8px;font-size:14px}
.res{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #1b3826;font-size:13px;cursor:pointer}
.res:last-child{border-bottom:0}
.res .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .tn.r{text-align:right}
.res .sc{min-width:46px;text-align:center;font-weight:700;background:#0a1c11;border-radius:8px;padding:2px 4px}
.res.me{background:#12301f;border-radius:8px;padding-left:6px;padding-right:6px}
.news{font-size:13px;padding:6px 0;border-bottom:1px solid #1b3826}
.news:last-child{border-bottom:0}
.pitch{position:relative;border-radius:14px;padding:12px 6px;background:repeating-linear-gradient(180deg,#1d6b3a 0 36px,#1a6235 36px 72px);border:2px solid #2f8a50;overflow:hidden}
.pitch:before{content:"";position:absolute;left:50%;top:50%;width:90px;height:90px;border:2px solid rgba(255,255,255,.22);border-radius:50%;transform:translate(-50%,-50%)}
.pitch:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.22)}
.prow2{position:relative;z-index:1;display:flex;justify-content:space-evenly;margin:8px 0}
.slot{width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;background:none;border:0;padding:0}
.slot .c{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;background:#f8fafc;color:#0b1f14;border:3px solid var(--ac);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.slot .c.mid{border-color:var(--ac2)}.slot .c.low{border-color:var(--bad)}
.slot .c.emp{background:rgba(0,0,0,.25);border:2px dashed rgba(255,255,255,.6);color:#fff}
.slot .c.oop{background:#fde68a}
.slot span{font-size:11px;color:#fff;text-shadow:0 1px 2px #000;max-width:62px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh{font-size:13px;color:var(--mut);margin:12px 0 4px;display:flex;justify-content:space-between}
.pl{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;background:var(--pan);border:1px solid var(--line);margin-bottom:5px}
.pl.in{border-color:#2e8b52;background:#11301f}
.pl .tog{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#0a1c11;font-size:16px;cursor:pointer;flex:none}
.pl.in .tog{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:700}
.pl .pm{flex:1;min-width:0;cursor:pointer}
.pl .pm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.pl .pm small{color:var(--mut);font-size:11px}
.pos{display:inline-block;font-size:10px;font-weight:600;border-radius:5px;padding:0 4px;margin-right:3px;vertical-align:1px}
.pGK{background:#854d0e;color:#fef08a}.pDF{background:#1e3a8a;color:#bfdbfe}.pMF{background:#14532d;color:#bbf7d0}.pFW{background:#7f1d1d;color:#fecaca}
.fx{font-size:10px;color:var(--blue)}
.ov{min-width:36px;text-align:center;font-weight:700;font-size:16px}
.fit{width:42px;height:6px;border-radius:3px;background:#0a1c11;overflow:hidden;flex:none}
.fit i{display:block;height:100%;background:var(--ac)}
.price{text-align:right;font-size:12px;white-space:nowrap}
.price b{display:block;color:var(--ac2);font-size:14px}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{color:var(--mut);font-weight:400;font-size:11px;padding:4px 2px;text-align:center}
.tb td{padding:6px 2px;text-align:center;border-top:1px solid #1b3826}
.tb td.t{text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.tb tr.me td{background:#12301f}
.tb tr.hum td.t b{color:var(--ac)}
.tb td.pts{font-weight:700}
.zone1 td:first-child{box-shadow:3px 0 0 var(--ac) inset}
.zoneR td:first-child{box-shadow:3px 0 0 var(--bad) inset}
.live .clock{font-size:13px;color:var(--ac2);font-weight:600}
.feed{max-height:34vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ev{font-size:14px;padding:6px 8px;border-radius:8px;background:#0b1d12;display:flex;gap:8px}
.ev .m{color:var(--mut);min-width:28px;font-size:12px;padding-top:2px}
.ev.g{background:#173d25;font-weight:600}
.ev.r{background:#3b1717}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 0;border-bottom:1px solid #1b3826}
.mini:last-child{border-bottom:0}
.mini .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tn.r{text-align:right}
.mini .sc{min-width:40px;text-align:center;font-weight:700}
.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{background:#facc15;color:#2b2100}100%{background:transparent}}
.code{font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--ac2)}
.bar{height:8px;border-radius:4px;background:#0a1c11;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.stat b{min-width:28px;text-align:center}
.stat .bar{flex:1}
#modal .bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal .sh{background:var(--pan);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
#modal h2{margin:0 0 4px;font-size:19px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.kv div{background:#0a1c11;border-radius:10px;padding:8px;text-align:center}
.kv b{display:block;font-size:17px}
.kv small{color:var(--mut);font-size:11px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(30px);opacity:0;background:#111827;border:1px solid #374151;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:14px}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.champ{text-align:center;padding:18px 10px;background:radial-gradient(circle at 50% 0,#4d3b06,#0f2418 70%);border:1px solid #7a5f10}
.champ .tro{font-size:54px}
.warn{background:#3a2a07;border:1px solid #7a5f10;color:#fde68a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.foot{text-align:center;color:#4f7a5e;font-size:11px;padding:18px 0 6px}
.pl.bn{border-color:#6b5a12;background:#262110}
.pl .tog.tb{font-size:13px;width:34px}
.pl.bn .tog.tb{background:var(--ac2);color:#2b2100;border-color:var(--ac2);font-weight:700}
.bench{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.bchips{display:flex;flex-wrap:wrap;gap:6px}
.bchip{border:1px solid #6b5a12;background:#262110;border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid #1b3826;font-size:13px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left}
.lrow.btnrow{cursor:pointer;border-radius:8px;padding:10px 6px}
.lrow.btnrow:active{background:var(--pan2)}
.lrow.dead{opacity:.45;text-decoration:line-through}
.ev.sb{background:#13263a}
.ctl{border-color:#2e8b52}
.mini{cursor:pointer}.mini.me{background:#12301f;border-radius:6px}
code{background:#0a1c11;padding:1px 5px;border-radius:5px}
.mute{background:none;border:0;font-size:20px;padding:4px;cursor:pointer;flex:none}
#pop{position:fixed;left:0;right:0;top:calc(70px + env(safe-area-inset-top));z-index:40;display:flex;justify-content:center;pointer-events:none;padding:0 14px}
#pop.on{pointer-events:auto}
#pop .pc{position:relative;overflow:hidden;width:100%;max-width:420px;border-radius:22px;padding:18px 16px 14px;text-align:center;
 background:linear-gradient(rgba(0,0,0,.28),rgba(0,0,0,.28)),radial-gradient(110% 70% at 50% 0%,var(--c1),#0b1a10 88%);border:2px solid rgba(255,255,255,.35);box-shadow:0 18px 50px rgba(0,0,0,.6),0 0 0 4px rgba(0,0,0,.25);
 animation:popIn .45s cubic-bezier(.2,1.4,.4,1) both;color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.55)}
#pop.out .pc{animation:popOut .35s ease-in both}
@keyframes popIn{0%{transform:translateY(-30px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes popOut{to{transform:translateY(-20px) scale(.9);opacity:0}}
#pop .pk{font-size:54px;line-height:1;animation:pk 1s ease-in-out infinite alternate}
@keyframes pk{to{transform:scale(1.15) rotate(-8deg)}}
#pop .ph{font-size:30px;font-weight:700;letter-spacing:.5px;margin:6px 0 4px;line-height:1.1}
#pop .good .ph,#pop.good .ph{background:linear-gradient(#fff,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent}
#pop .pt{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px}
#pop .pn{font-size:22px;font-weight:600;margin-top:6px}
#pop .ps{font-size:13px;opacity:.9}
#pop .psc{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;background:rgba(0,0,0,.35);border-radius:12px;padding:6px 10px;font-size:14px}
#pop .psc b{font-size:22px}#pop .psc small{opacity:.8;margin-left:4px}
#pop .pbar{height:4px;background:rgba(0,0,0,.3);border-radius:2px;margin-top:12px;overflow:hidden}
#pop .pbar i{display:block;height:100%;background:#fff;animation:pbar var(--ms) linear both}
@keyframes pbar{from{width:100%}to{width:0}}
#pop .ptap{font-size:10px;opacity:.6;margin-top:4px}
#pop.small .pc{padding:10px 12px;border-radius:16px;max-width:360px}
#pop.small .pk{font-size:28px;animation:none}#pop.small .ph{font-size:16px}#pop.small .pn{font-size:16px}#pop.small .psc b{font-size:17px}
#pop.pn0 .pc{--c1:#2f7a4f}
#pop.bad .pc{filter:saturate(.7)}
#pop.bad .pk{animation:shake .5s ease-in-out 3}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#pop .conf i{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;opacity:.95;animation:conf 2.4s ease-in forwards}
@keyframes conf{to{transform:translateY(340px) rotate(540deg);opacity:0}}
#guide{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:16px}
#guide.on{display:flex}
#guide .gd{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:400px;width:100%}
#guide h2{margin:0 0 8px;font-size:19px}#guide ol{padding-left:20px;margin:8px 0;line-height:1.9}
#guide .ico{display:inline-block;background:#1e3a8a;color:#fff;border-radius:6px;padding:0 6px}
#guide .garrow{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:40px;animation:bounce 1s infinite}
@keyframes bounce{50%{transform:translate(-50%,-12px)}}
.ibar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:15;max-width:536px;margin:0 auto;display:flex;align-items:center;gap:10px;background:#123a24;border:1px solid var(--ac);border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ibar>span{font-size:28px}.ibar b{display:block;font-size:14px}.ibar small{color:var(--mut);font-size:12px}
.ibar .ix{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 6px;cursor:pointer}
.card.inst{border-color:#2e8b52;background:linear-gradient(135deg,#123a24,#0f2418)}

.netbar{position:sticky;top:0;z-index:7;background:#3a2a07;border-bottom:1px solid #7a5f10;color:#fde68a;font-size:13px;padding:8px 16px;display:flex;align-items:center;gap:8px;justify-content:center;text-align:center}
.ctag{display:inline-block;color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid rgba(255,255,255,.25)}
.pens{display:block;font-size:10px;font-weight:400;color:var(--mut)}
.staff .lv{display:flex;gap:3px;align-items:center;margin-top:3px}
.staff .lv i{width:18px;height:8px;border-radius:3px;background:#0a1c11;border:1px solid var(--line)}
.staff .lv i.on{background:var(--ac);border-color:var(--ac)}
.staff .eff{font-size:13px;background:#0a1c11;border-radius:8px;padding:6px 8px}
.rs{min-width:40px;text-align:center;font-weight:700;border-radius:6px;padding:1px 6px;font-size:12px}
.rs.w{background:#166534;color:#bbf7d0}.rs.d{background:#4b5563;color:#e5e7eb}.rs.l{background:#7f1d1d;color:#fecaca}
.nav button{max-width:96px;font-size:11px}
.gkalert{border-color:#b91c1c;background:linear-gradient(135deg,#3b0a0a,#1f0d0d);margin-top:8px}
.pitchHost{margin:0 0 12px;border-radius:14px;overflow:hidden;border:2px solid #2f8a50;background:#0e3b22;line-height:0;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.pitchHost canvas{display:block;width:100%}
.live .vs .mid{font-size:26px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="pop"></div>
<div id="guide"></div>

function valueOf(p){

  const af=p.ag<=21?1.35:p.ag<=24?1.2:p.ag<=28?1:p.ag<=30?0.8:p.ag<=32?0.55:0.35;
  return r1(b*af*(1+Math.max(0,p.pt-p.o)*0.03));
}

function rrRounds(ids){ // round robin (circle method) — คืนรอบละคู่ [h,a]
  const arr=shuffle(ids.slice());const n=arr.length,rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if(i===0?r%2:i%2)[h,a]=[a,h];m.push([h,a])}rounds.push(m);arr.splice(1,0,arr.pop())}
  return rounds;
}
function leagueFx(ids){const r=rrRounds(ids);return r.concat(shuffle(r.map(m=>m.map(([h,a])=>[a,h]))))}

function setupSeason(){
  S.lgx={pl:{fx:leagueFx(S.div.pl),res:[]},ch:{fx:leagueFx(S.div.ch),res:[]}};
  const ur=rrRounds(S.uclT);
  S.cup={fa:{r:[]},efl:{r:[]},cpo:{r:[]},ucl:{fx:ur.slice(0,8),res:[],r:{}}};
  const items=[];const add=(c,r,t)=>items.push({c,r,d:Math.round(t*SEASON_DAYS)});
  for(let r=0;r<38;r++)add('pl',r,0.012+r/37*0.915);
  for(let r=0;r<46;r++)add('ch',r,r/45*0.93);
  add('cpo',0,0.955);add('cpo',1,0.985);
  for(let k=0;k<8;k++)add('ucl',k,0.11+k*0.045);
  [0.5,0.58,0.67,0.75,0.975].forEach((t,i)=>add('ucl',8+i,t));
  [0.45,0.53,0.62,0.70,0.80,0.99].forEach((t,i)=>add('fa',i,t));
  [0.025,0.085,0.21,0.34,0.48,0.60].forEach((t,i)=>add('efl',i,t));
  const lgDays=new Set(items.filter(x=>x.c==='pl'||x.c==='ch').map(x=>x.d));const used=new Set();
  items.filter(x=>x.c!=='pl'&&x.c!=='ch').sort((a,b)=>a.d-b.d).forEach(x=>{while(lgDays.has(x.d)||used.has(x.d))x.d++;used.add(x.d)});
  const by={};items.forEach(x=>(by[x.d]=by[x.d]||[]).push({c:x.c,r:x.r}));
  S.cal=Object.keys(by).map(Number).sort((a,b)=>a-b).map(d=>({d,it:by[d]}));
  S.day=0;S.lastD=S.cal[0].d-7;
  S.uclT.forEach(id=>{T_(id).budget=r1(T_(id).budget+15)}); // เงินร่วมแข่ง UCL
}
const lgDone=c=>S.lgx[c].res.filter(Boolean).length>=S.lgx[c].fx.length;
const koWinners=(c,r)=>{const R=S.cup[c].r[r];return R&&R.ties.every(t=>t.w!=null)?R.ties.map(t=>t.w):null};
function pairUp(ids,neutral){shuffle(ids);const t=[];for(let i=0;i+1<ids.length;i+=2)t.push({h:ids[i],a:ids[i+1],n:neutral?1:0});return t}
function drawKO(c,r){
  if(c==='fa'||c==='efl'){
    if(r===0)return pairUp(S.div.ch.slice());
    const w=koWinners(c,r-1);if(!w)return null;
    return pairUp(r===1?w.concat(S.div.pl):w.slice(),r===5);
  }
  if(c==='cpo'){
    if(r===0){if(!lgDone('ch'))return null;const tb=leagueTable('ch');return[{h:tb[2].id,a:tb[5].id},{h:tb[3].id,a:tb[4].id}]}
    const w=koWinners('cpo',0);return w?[{h:w[0],a:w[1],n:1}]:null;
  }
  if(c==='ucl'){
    if(r===8){if(S.cup.ucl.res.filter(Boolean).length<8)return null;const ids=uclTable().map(x=>x.id);const t=[];for(let i=8;i<16;i++)t.push({h:ids[i],a:ids[31-i]});return t}
    if(r===9){const w=koWinners('ucl',8);if(!w)return null;const top=uclTable().slice(0,8).map(x=>x.id);const pw=shuffle(w.slice());return top.map((id,i)=>({h:id,a:pw[i]}))}
    const w=koWinners('ucl',r-1);return w?pairUp(w.slice(),r===12):null;
  }
  return null;
}
function koTies(c,r){const C=S.cup[c];if(!C.r[r]){const t=drawKO(c,r);if(!t)return null;C.r[r]={ties:t}}return C.r[r].ties}
function matchesOf(it){ // [{h,a,n,ko}]
  const {c,r}=it;
  if(c==='pl'||c==='ch')return S.lgx[c].fx[r].map(([h,a])=>({h,a}));
  if(c==='ucl'&&r<8)return S.cup.ucl.fx[r].map(([h,a])=>({h,a}));
  const t=koTies(c,r);return t?t.map(x=>({h:x.h,a:x.a,n:x.n,ko:1})):[];
}
function teamItem(slot,tid){for(const it of slot.it){if(matchesOf(it).some(m=>m.h===tid||m.a===tid))return it}return null}
function leagueTable(c){
  const ids=S.div[c];const t={};ids.forEach(id=>t[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,fm:[]});
  S.lgx[c].res.forEach(rd=>{if(rd)rd.forEach(m=>addRes(t,m))});
  return sortTb(Object.values(t));
}
function uclTable(){const t={};S.uclT.forEach(id=>t[id]={id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,fm:[]});S.cup.ucl.res.forEach(rd=>{if(rd)rd.forEach(m=>addRes(t,m))});return sortTb(Object.values(t))}
function addRes(t,m){const A=t[m.h],B=t[m.a];if(!A||!B)return;A.p++;B.p++;A.gf+=m.hg;A.ga+=m.ag;B.gf+=m.ag;B.ga+=m.hg;
  if(m.hg>m.ag){A.w++;B.l++;A.pts+=3;A.fm.push('W');B.fm.push('L')}else if(m.hg<m.ag){B.w++;A.l++;B.pts+=3;A.fm.push('L');B.fm.push('W')}else{A.d++;B.d++;A.pts++;B.pts++;A.fm.push('D');B.fm.push('D')}}
const sortTb=a=>a.sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||T_(x.id).name.localeCompare(T_(y.id).name));
const table=()=>{const T=myTeam();return leagueTable(T&&T.div==='ch'?'ch':'pl')};

/* ---------------- ตัวจริง/สำรอง ---------------- */
const effScore=p=>p.o*(0.72+0.28*p.ft/100);
const avail=p=>p&&p.ij<=0&&!p.sp;
function autoXI(T){
  const sl=slotsOf(T.form);const pool=squad(T.id).filter(avail).sort((a,b)=>effScore(b)-effScore(a));
  const used=new Set();const xi=sl.map(()=>null);
  sl.forEach((pos,i)=>{const p=pool.find(q=>q.pos===pos&&!used.has(q.id));if(p){xi[i]=p.id;used.add(p.id)}});
  sl.forEach((pos,i)=>{if(xi[i]==null){const p=pool.find(q=>!used.has(q.id)&&(pos==='GK')===(q.pos==='GK'))||pool.find(q=>!used.has(q.id));if(p){xi[i]=p.id;used.add(p.id)}}});
  T.xi=xi;T.bn=[];fixBench(T);
}
function fixXI(T){
  const sl=slotsOf(T.form);const used=new Set();
  const xi=sl.map((_,i)=>{const id=T.xi[i];const p=S.pl[id];if(p&&p.t===T.id&&avail(p)&&!used.has(id)){used.add(id);return id}return null});
  const bnIds=new Set(T.bn||[]);const pool=squad(T.id).filter(p=>avail(p)&&!used.has(p.id)).sort((a,b)=>(bnIds.has(a.id)?0:1)-(bnIds.has(b.id)?0:1)||effScore(b)-effScore(a));
  sl.forEach((pos,i)=>{if(xi[i]==null&&pool.length){let k=pool.findIndex(q=>q.pos===pos);if(k<0)k=pool.findIndex(q=>(pos==='GK')===(q.pos==='GK'));if(k<0)k=0;xi[i]=pool[k].id;pool.splice(k,1)}});
  T.xi=xi;
}
function fixBench(T){
  const inXI=new Set(T.xi.filter(Boolean));const seen=new Set();
  T.bn=(T.bn||[]).filter(id=>{const p=S.pl[id];if(!p||p.t!==T.id||!avail(p)||inXI.has(id)||seen.has(id))return false;seen.add(id);return true}).slice(0,BENCH);
  const pool=squad(T.id).filter(p=>avail(p)&&!inXI.has(p.id)&&!seen.has(p.id)).sort((a,b)=>effScore(b)-effScore(a));
  if(!T.bn.some(id=>S.pl[id].pos==='GK')){const g=pool.find(p=>p.pos==='GK');if(g&&T.bn.length<BENCH){T.bn.push(g.id);seen.add(g.id)}}
  ['DF','MF','FW'].forEach(pos=>{if(T.bn.length<BENCH&&!T.bn.some(id=>S.pl[id].pos===pos)){const q=pool.find(p=>p.pos===pos&&!seen.has(p.id));if(q){T.bn.push(q.id);seen.add(q.id)}}});
  for(const p of pool){if(T.bn.length>=BENCH)break;if(!seen.has(p.id)&&p.pos!=='GK'){T.bn.push(p.id);seen.add(p.id)}}
}
function reslot(on,form,out){
  const sl=slotsOf(form);const ids=on.filter(Boolean);const res=sl.map(()=>null);const used=new Set();
  if(on[0]&&!out.includes(on[0])){res[0]=on[0];used.add(on[0])}
  const live=ids.filter(id=>!out.includes(id)),dead=ids.filter(id=>out.includes(id));
  sl.forEach((pos,i)=>{const id=live.find(x=>!used.has(x)&&S.pl[x].pos===pos);if(id){res[i]=id;used.add(id)}});
  sl.forEach((pos,i)=>{if(res[i]==null){const id=live.find(x=>!used.has(x)&&(pos==='GK')===(S.pl[x].pos==='GK'))||live.find(x=>!used.has(x));if(id){res[i]=id;used.add(id)}}});
  sl.forEach((pos,i)=>{if(res[i]==null){const id=dead.find(x=>!used.has(x));if(id){res[i]=id;used.add(id)}}});
  return res;
}

const TXT={
 g:['⚽ โก๊ลลล! {p} ซัดเข้าไปให้ {t}','⚽ ประตู! {p} ปลิดชีพในกรอบเขตโทษ','⚽ {p} โหม่งเข้าไปอย่างสวยงาม!','⚽ {p} หลุดเดี่ยวแล้วแปไปเสาไกล!','⚽ {p} ยิงไกลเสียบสามเหลี่ยม!','⚽ {p} สังหารจุดโทษอย่างเยือกเย็น','⚽ {p} ซ้ำลูกที่กระดอนมาเข้าไป!'],
 sv:['🧤 {k} พุ่งปัดลูกยิงของ {p} ได้อย่างยอดเยี่ยม','🧤 {p} ยิงตรงมือ {k}','🧤 {k} ออกมาตัดหน้า {p} ได้ทัน'],
 c:['{p} ซัดเฉียดเสาออกไปนิดเดียว','{p} โหม่งข้ามคานไป','ลูกยิงของ {p} ชนเสา!','{p} ยิงไกลแต่ไม่ได้ลุ้น','{p} ได้จังหวะยิงแต่ถูกบล็อกไว้','{p} หลุดเข้าไปแต่ยิงข้ามคาน']
};
const fill=(s,o)=>s.replace(/\{(\w)\}/g,(_,k)=>o[k]||'');
function wpick(list,wf){if(!list.length)return null;let tot=0;const w=list.map(x=>{const v=Math.max(0.01,wf(x));tot+=v;return v});let r=rnd()*tot;for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[list.length-1]}
function shortN(p){
  if(!p)return'-';const w=p.n.trim().split(' ');if(w.length===1)return p.n;if(p.cu&&p.n.length<=13)return p.n;
  let i=w.length-1;while(i>0&&/^(van|de|den|der|di|da|dos|von|le|la|el|al|ten|ter)$/i.test(w[i-1]))i--;return w.slice(i).join(' ');
}
const nm=id=>S.pl[id]?S.pl[id].n:'-';
const fitLv=id=>{const p=S.pl[id];const T=p&&S.teams[p.t];return T?T.st.fit:0};
const fitNow=(m,id)=>{const p=S.pl[id];return p?Math.max(20,p.ft-(m.mp[id]||0)*0.17*(1-0.05*fitLv(id))):0};
function newLiveMatch(f){
  const TH=T_(f.h),TA=T_(f.a);
  const m={h:f.h,a:f.a,n:f.n?1:0,ko:f.ko?1:0,done:false,sc:[0,0],ev:[],on:[TH.xi.slice(),TA.xi.slice()],sl:[slotsOf(TH.form),slotsOf(TA.form)],bn:[TH.bn.slice(),TA.bn.slice()],sb:[0,0],sh:[0,0],ot:[0,0],cd:[0,0],yel:{},out:[],mp:{},pl:[...TH.xi,...TA.xi].filter(Boolean),gs:[],as:[],inj:[],red:[],mid:[0,0],tc:[TH.tac,TA.tac],pen:null,et:0};
  m.ev.push({m:0,s:-1,k:'ko',x:'🟢 เริ่มเกม! '+TH.name+' พบ '+TA.name+(m.n?' (สนามกลาง)':'')});
  return m;
}
function powerLive(m,s){
  const T=T_(s?m.a:m.h);const sl=m.sl[s];let gk=25;const df=[],mf=[],fw=[];
  sl.forEach((pos,i)=>{const id=m.on[s][i];let e=25;
    if(id&&!m.out.includes(id)){const p=S.pl[id];e=p.o*(0.72+0.28*fitNow(m,id)/100);if(p.pos!==pos)e-=(pos==='GK'||p.pos==='GK')?25:7}
    if(pos==='GK')gk=e;else if(pos==='DF')df.push(e);else if(pos==='MF')mf.push(e);else fw.push(e)});
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:35;
  const d=df.length,mm=mf.length,w=fw.length,t=T.tac,home=s===0&&!m.n;
  return{atk:av(fw)*0.42+av(mf)*0.38+av(df)*0.2+(w-2)*1.3+(mm-4)*0.4+[-3.5,0,3.5][t]+(home?1.5:0),
         def:av(df)*0.42+av(mf)*0.23+gk*0.35+(d-4)*1.3+[3.5,0,-3.5][t]+(home?1:0),mid:av(mf)+(mm-4)*1.5};
}
const active=(m,s)=>m.on[s].filter(id=>id&&!m.out.includes(id));
const posIn=(m,s,id)=>{const i=m.on[s].indexOf(id);return m.sl[s][i]||S.pl[id].pos};
function doSub(m,s,off,on,why,min){
  const i=m.on[s].indexOf(off);if(i<0)return false;const bi=m.bn[s].indexOf(on);if(bi<0)return false;
  m.on[s][i]=on;m.bn[s].splice(bi,1);m.sb[s]++;if(!m.pl.includes(on))m.pl.push(on);
  m.ev.push({m:min,s,k:'sub',x:'🔁 '+nm(on)+' ลงสนามแทน '+nm(off)+(why?' ('+why+')':'')});return true;
}
function bestBench(m,s,pos){
  const c=m.bn[s].map(id=>S.pl[id]).filter(avail);if(!c.length)return null;
  const same=c.filter(p=>p.pos===pos);const pool=same.length?same:c.filter(p=>(p.pos==='GK')===(pos==='GK'));
  return (pool.length?pool:c).sort((a,b)=>b.o-a.o)[0].id;
}
function stepMinute(m,min){
  const P=[powerLive(m,0),powerLive(m,1)];
  m.mid[0]+=P[0].mid;m.mid[1]+=P[1].mid;
  for(let s=0;s<2;s++)active(m,s).forEach(id=>m.mp[id]=(m.mp[id]||0)+1);
  for(let s=0;s<2;s++){
    const T=T_(s?m.a:m.h);const act=active(m,s);if(!act.length)continue;
    const xg=clamp(1.2*Math.exp((P[s].atk-P[1-s].def)/20),0.12,4);const lam=xg/90;
    const shooters=act.filter(id=>posIn(m,s,id)!=='GK');
    if(rnd()<lam){
      const sh=wpick(shooters,id=>({FW:6,MF:3,DF:1})[posIn(m,s,id)]*Math.pow(S.pl[id].o/60,2));if(sh==null)continue;
      let as=null;if(rnd()<0.7)as=wpick(shooters.filter(id=>id!==sh),id=>({MF:5,FW:3,DF:2})[posIn(m,s,id)]);
      m.sc[s]++;m.sh[s]++;m.ot[s]++;m.gs.push(sh);if(as)m.as.push(as);
      m.ev.push({m:min,s,k:'g',p:sh,a:as,sc:m.sc.slice(),x:fill(pick(TXT.g),{p:nm(sh),t:T.name})+(as?' (แอสซิสต์ '+nm(as)+')':'')+' — '+m.sc[0]+'-'+m.sc[1]});
    }else if(rnd()<lam*5.5){
      const p=wpick(shooters,id=>({FW:5,MF:3,DF:1})[posIn(m,s,id)]);if(p==null)continue;m.sh[s]++;
      if(rnd()<0.33){m.ot[s]++;m.ev.push({m:min,s,k:'sv',p,x:fill(pick(TXT.sv),{p:nm(p),k:nm(m.on[1-s][0])})})}
      else m.ev.push({m:min,s,k:'c',p,x:fill(pick(TXT.c),{p:nm(p)})});
    }
    if(rnd()<0.021){const p=pick(act);m.yel[p]=(m.yel[p]||0)+1;m.cd[s]++;
      if(m.yel[p]>=2){m.out.push(p);m.red.push(p);m.ev.push({m:min,s,k:'r',p,x:'🟥 '+nm(p)+' ('+T.sh+') ใบเหลืองใบที่สอง โดนไล่ออก!'})}
      else m.ev.push({m:min,s,k:'y',p,x:'🟨 '+nm(p)+' ('+T.sh+') รับใบเหลือง'})}
    else if(rnd()<0.0009){const p=pick(act);m.out.push(p);m.red.push(p);m.cd[s]++;m.ev.push({m:min,s,k:'r',p,x:'🟥 ใบแดงตรงๆ! '+nm(p)+' ('+T.sh+') ต้องออกจากสนาม'})}
    if(rnd()<0.0017*(1-0.12*T.st.med)){const p=pick(active(m,s));if(p&&!m.inj.includes(p)){m.inj.push(p);
      m.ev.push({m:min,s,k:'i',p,x:'🚑 '+nm(p)+' ('+T.sh+') บาดเจ็บ'});
      const rep=m.sb[s]<MAX_SUBS?bestBench(m,s,posIn(m,s,p)):null;
      if(rep)doSub(m,s,p,rep,'บาดเจ็บ',min);else m.out.push(p)}}
  }
}
const humanCtl=T=>!!T.owner;
const gkDead=(m,s)=>{const id=m.on[s][0];return !id||m.out.includes(id)};
function gkField(m,s,pid,min,auto){ // ย้ายผู้เล่นในสนามไปเฝ้าประตู (ไม่เสียสิทธิ์เปลี่ยนตัว)
  const i=m.on[s].indexOf(pid);if(i<=0||m.out.includes(pid))return false;
  const old=m.on[s][0];m.on[s][0]=pid;m.on[s][i]=old;
  m.ev.push({m:min,s,k:'gk',p:pid,x:'🧤 '+nm(pid)+' ย้ายไปเฝ้าประตู'+(auto?' (ฉุกเฉิน)':'')});return true;
}
function gkSub(m,s,off,on,min){ // เอาผู้เล่นออก 1 คน แล้วส่งผู้รักษาประตูสำรองลงเฝ้าประตู
  if(!gkDead(m,s))return false;const i=m.on[s].indexOf(off),bi=m.bn[s].indexOf(on);if(i<=0||bi<0||m.out.includes(off))return false;
  const old=m.on[s][0];m.on[s][0]=on;m.on[s][i]=old;m.bn[s].splice(bi,1);m.sb[s]++;if(!m.pl.includes(on))m.pl.push(on);
  m.ev.push({m:min,s,k:'sub',p:on,x:'🔁🧤 '+nm(on)+' ลงเฝ้าประตู (เอา '+nm(off)+' ออก)'});return true;
}
function fixGK(m,s,min,useSub){
  if(!gkDead(m,s))return;const lim=MAX_SUBS+(m.et?1:0);
  const alive=active(m,s).filter(id=>id!==m.on[s][0]);
  const benchGK=m.bn[s].map(id=>S.pl[id]).filter(p=>p&&avail(p)&&p.pos==='GK').sort((a,b)=>b.o-a.o)[0];
  if(useSub&&benchGK&&m.sb[s]<lim&&alive.length){
    const off=alive.map(id=>S.pl[id]).sort((a,b)=>(a.pos==='FW'?0:a.pos==='MF'?1:2)-(b.pos==='FW'?0:b.pos==='MF'?1:2)||a.o-b.o)[0];
    if(off&&gkSub(m,s,off.id,benchGK.id,min))return;
  }
  const df=alive.map(id=>S.pl[id]).sort((a,b)=>(a.pos==='DF'?0:1)-(b.pos==='DF'?0:1)||b.o-a.o)[0];
  if(df)gkField(m,s,df.id,min,true);
}
function aiMatch(m,min){
  for(let s=0;s<2;s++){
    const T=T_(s?m.a:m.h);
    if(humanCtl(T)){ // ทีมเรา: ถ้าไม่มีโกลเกิน 2 นาที ระบบย้ายผู้เล่นไปเฝ้าประตูให้เอง
      if(gkDead(m,s)){m.gkd=m.gkd||[0,0];if(++m.gkd[s]>=3){fixGK(m,s,min,false);m.gkd[s]=0}}else if(m.gkd)m.gkd[s]=0;
      continue}
    if(gkDead(m,s))fixGK(m,s,min,true);
    const diff=m.sc[s]-m.sc[1-s];
    if(min===70&&diff<0&&T.tac!==2){T.tac=2;m.ev.push({m:min,s,k:'tac',x:'📋 '+T.name+' เปลี่ยนเป็นเกมบุก'})}
    if(min===82&&diff>0&&T.tac!==0){T.tac=0;m.ev.push({m:min,s,k:'tac',x:'📋 '+T.name+' ถอยมาตั้งรับ'})}
    if(min>=58&&m.sb[s]<4&&rnd()<0.13){
      const c=active(m,s).filter(id=>posIn(m,s,id)!=='GK').sort((a,b)=>fitNow(m,a)-fitNow(m,b));
      const off=c[0];if(off&&fitNow(m,off)<74){const on=bestBench(m,s,posIn(m,s,off));if(on&&S.pl[on].pos!=='GK')doSub(m,s,off,on,'',min)}
    }
    m.tc[s]=T.tac;
  }
}
function shootout(m){
  const sk=s=>{const a=active(m,s).map(id=>S.pl[id].o).sort((x,y)=>y-x).slice(0,5);return a.length?a.reduce((x,y)=>x+y,0)/a.length:60};
  const gk=s=>{const p=S.pl[m.on[s][0]];return p?p.o:60};
  const pr=s=>clamp(0.76+(sk(s)-75)*0.004-(gk(1-s)-75)*0.005,0.55,0.92);
  let a=0,b=0;for(let k=0;k<5;k++){if(rnd()<pr(0))a++;if(rnd()<pr(1))b++}
  for(let k=0;k<20&&a===b;k++){const x=rnd()<pr(0),y=rnd()<pr(1);a+=x;b+=y}
  if(a===b){if(rnd()<0.5)a++;else b++}
  return[a,b];
}
function finishMatch(m,min){
  m.done=true;const H=T_(m.h),A=T_(m.a);
  if(m.pen){m.ev.push({m:min,s:-1,k:'pen',x:'🎯 ดวลจุดโทษ '+H.name+' '+m.pen[0]+'-'+m.pen[1]+' '+A.name+' — '+(m.pen[0]>m.pen[1]?H.name:A.name)+' เข้ารอบ!'})}
  m.ev.push({m:min,s:-1,k:'ft',x:'🏁 จบเกม '+H.name+' '+m.sc[0]+'-'+m.sc[1]+' '+A.name+(m.et?' (ต่อเวลา)':'')+(m.pen?' · จุดโทษ '+m.pen[0]+'-'+m.pen[1]:'')});
}
function minuteAll(ctx){ // ctx: {min, ms}
  ctx.min++;const min=ctx.min;
  ctx.ms.forEach(m=>{if(m.done)return;
    if(min===46)m.ev.push({m:45,s:-1,k:'ht',x:'⏸️ หมดครึ่งแรก '+m.sc[0]+'-'+m.sc[1]});
    if(min===94&&!m.done)m.ev.push({m:93,s:-1,k:'et',x:'⏱️ เสมอกันในเวลา 90 นาที — ต่อเวลาพิเศษ 30 นาที!'});
    stepMinute(m,min);aiMatch(m,min);
    if(min===93&&(!m.ko||m.sc[0]!==m.sc[1]))finishMatch(m,93);
    else if(min===93)m.et=1;
    else if(min===123){if(m.sc[0]===m.sc[1])m.pen=shootout(m);finishMatch(m,123)}
  });
  return ctx.ms.every(m=>m.done);

const winnerOf=m=>m.sc[0]>m.sc[1]?m.h:m.sc[1]>m.sc[0]?m.a:m.pen?(m.pen[0]>m.pen[1]?m.h:m.a):null;

/* ---------------- ผลการแข่งขัน → บันทึก/เงิน/สถิติ ---------------- */
function storeItem(it,ms){
  const {c,r}=it;const rows=ms.map(m=>({h:m.h,a:m.a,hg:m.sc[0],ag:m.sc[1]}));
  if(c==='pl'||c==='ch')S.lgx[c].res[r]=rows;
  else if(c==='ucl'&&r<8){S.cup.ucl.res[r]=rows;ms.forEach(m=>{const w=winnerOf(m);if(w!=null)T_(w).budget=r1(T_(w).budget+2.1);else{T_(m.h).budget=r1(T_(m.h).budget+0.7);T_(m.a).budget=r1(T_(m.a).budget+0.7)}})}
  else{const ties=S.cup[c].r[r].ties;ms.forEach((m,i)=>{const t=ties[i];Object.assign(t,{hg:m.sc[0],ag:m.sc[1],et:m.et||0,ph:m.pen?m.pen[0]:null,pa:m.pen?m.pen[1]:null,w:winnerOf(m)});
    const bonus=c==='ucl'?[0,0,0,0,0,0,0,0,4,10,12.5,15,0][r]:c==='fa'?[0.3,0.5,0.8,1.5,2,0][r]:c==='efl'?[0.2,0.3,0.4,0.8,1.2,0][r]:0;
    if(bonus)T_(t.w).budget=r1(T_(t.w).budget+bonus)})}
}
function postMatches(ms){
  const played=new Map();ms.forEach(m=>m.pl.forEach(id=>played.set(id,m.mp[id]||0)));
  const teamsPlayed=new Set();ms.forEach(m=>{teamsPlayed.add(m.h);teamsPlayed.add(m.a)});
  played.forEach((mins,id)=>{const p=S.pl[id];if(!p)return;if(mins>=1)p.ap++;const T=T_(p.t);const f=T?T.st.fit:0;p.ft=Math.max(30,Math.round(p.ft-mins*0.21*(1-0.05*f)-rnd()*3));p._pl=1});
  Object.values(S.pl).forEach(p=>{if(p.sp>0&&teamsPlayed.has(p.t)&&!played.has(p.id))p.sp--});
  ms.forEach(m=>{
    m.gs.forEach(id=>{if(S.pl[id])S.pl[id].g++});m.as.forEach(id=>{if(S.pl[id])S.pl[id].as++});
    m.inj.forEach(id=>{const p=S.pl[id];if(!p)return;const T=T_(p.t);p.ij=Math.max(3,Math.round(ri(5,40)*(1-0.1*(T?T.st.med:0))));if(T&&T.owner)addNews('🚑 '+p.n+' บาดเจ็บ พักประมาณ '+p.ij+' วัน')});
    m.red.forEach(id=>{const p=S.pl[id];if(p)p.sp=1});
    if(!m.n){const H=T_(m.h);H.budget=r1(H.budget+Math.max(0.2,(H.rep-60)*0.1)*(H.div==='eu'?1:1))}
  });
}
/* ---------------- เวลาผ่านไป: ฟื้นฟู/พัฒนา/บาดเจ็บ/ค่าใช้จ่าย ---------------- */
function passDays(dd){
  if(dd<=0)return;
  const f7=dd/7;
  Object.values(S.pl).forEach(p=>{
    const T=p.t>=0?T_(p.t):null;const st=T?T.st:{med:0,fit:0,trn:0};const tp=TPLAN[T?T.tp:1];
    p.ft=Math.min(100,p.ft+dd*(2.4+0.45*st.fit+tp.rec));
    if(p.ij>0)p.ij=Math.max(0,p.ij-dd*(1+0.12*st.med));
    if(T&&tp.inj&&p.ij<=0&&rnd()<tp.inj*dd*(1-0.12*st.med)){p.ij=ri(3,10);if(T.owner)addNews('🏋️ '+p.n+' เจ็บจากการซ้อมหนัก พัก '+p.ij+' วัน')}
    const pl=p._pl;p._pl=0;let ch=0;const g=(1+0.1*st.trn)*tp.gr*f7*0.65*(p.o>=85?0.6:1);
    if(p.ag<=21){if(p.o<p.pt&&rnd()<(pl?0.16:0.07)*g)ch=1}else if(p.ag<=25){if(p.o<p.pt&&rnd()<(pl?0.09:0.03)*g)ch=1}
    else if(p.ag>=33){if(rnd()<0.06*f7*(1-0.08*st.trn))ch=-1}else if(p.ag>=30){if(rnd()<0.03*f7*(1-0.08*st.trn))ch=-1}
    if(ch){p.o=clamp(p.o+ch,35,94);p.v=valueOf(p)}
  });
  S.teams.forEach(T=>{
    if(T.div==='eu')return;
    const sq=squad(T.id);const tv=T.div==='pl'?3.5:1.0;
    const staffW=Object.keys(STAFF).reduce((s,k)=>s+STAFF[k].wage*T.st[k],0);
    T.budget=r1(T.budget+f7*(tv-sq.reduce((s,p)=>s+p.v,0)*0.004-staffW));
  });
}
function aiMarket(){
  S.teams.forEach(T=>{
    if(T.owner||T.div==='eu')return;const sq=squad(T.id);
    if(sq.length>27){const w=sq.sort((a,b)=>a.o-b.o)[0];w.t=-1;T.budget=r1(T.budget+w.v*0.7);return}
    if(rnd()>0.06||sq.length>=28)return;
    fixXI(T);const sl=slotsOf(T.form);let wi=-1,wo=99;
    T.xi.forEach((id,i)=>{const p=S.pl[id];if(p&&i>0&&p.o<wo){wo=p.o;wi=i}});if(wi<0)return;const pos=sl[wi];
    const c=Object.values(S.pl).filter(p=>p.t===-1&&p.pos===pos&&p.o>wo+2&&p.v<=T.budget*0.5).sort((a,b)=>b.o-a.o)[0];
    if(c){c.t=T.id;T.budget=r1(T.budget-c.v);if(T.div==='pl')addNews('✍️ '+T.name+' คว้าตัว '+c.n+' ('+c.pos+' '+c.o+') '+money(c.v))}
  });
}

let tickT=null,playTimer=null,endT=null;
function prepTeams(ms){
  const ids=new Set();ms.forEach(f=>{ids.add(f.h);ids.add(f.a)});
  ids.forEach(id=>{const T=T_(id);if(!T.owner){if(rnd()<0.1)T.form=bestForm(T);T.tac=1;autoXI(T)}else{fixXI(T);fixBench(T)}});
}
function slotBegin(slot){passDays(slot.d-S.lastD);S.lastD=slot.d}
function simItemInstant(it){
  const fs=matchesOf(it);prepTeams(fs);const ms=fs.map(newLiveMatch);const ctx={min:0,ms};
  while(!minuteAll(ctx)&&ctx.min<130){}

}
function slotHasUser(slot){const T=myTeam();return T?teamItem(slot,T.id):null}
function autoAdvance(){ // จำลองวันที่ไม่มีทีมเราแข่ง จนถึงนัดถัดไปของเรา
  let n=0;
  while(S.day<S.cal.length){
    const slot=S.cal[S.day];if(slotHasUser(slot))break;
    slotBegin(slot);const ms=[];slot.it.forEach(it=>ms.push(...simItemInstant(it)));postMatches(ms);
    slot.it.forEach(it=>koNews(it));if(n%3===0)aiMarket();S.day++;n++;
  }
  if(S.day>=S.cal.length)seasonEnd();
}
function koNews(it){
  if(it.c==='pl'||it.c==='ch'||(it.c==='ucl'&&it.r<8))return;
  const R=S.cup[it.c].r[it.r];if(!R)return;const fin=(it.c==='ucl'&&it.r===12)||(it.c!=='ucl'&&it.r===(it.c==='cpo'?1:5));
  const T=myTeam();
  R.ties.forEach(t=>{if(!T||(t.h!==T.id&&t.a!==T.id))return;const won=t.w===T.id;
    addNews((won?'✅ ':'❌ ')+COMP[it.c].n+' '+roundName(it.c,it.r)+': '+T_(t.h).sh+' '+t.hg+'-'+t.ag+' '+T_(t.a).sh+(t.ph!=null?' (จุดโทษ '+t.ph+'-'+t.pa+')':'')+(won?(fin?' 🏆 แชมป์!':' — เข้ารอบ'):' — ตกรอบ'))});
  if(fin){const w=R.ties[0].w;addNews('🏆 '+T_(w).name+' คว้าแชมป์'+COMP[it.c].n+'!')}
}
function startRound(){
  if(!S||S.phase!=='pre')return;clearTimeout(playTimer);
  const T=myTeam();if(!T){autoAdvanceSkip();return}
  if(S.day>=S.cal.length){seasonEnd();bump();return}
  const slot=S.cal[S.day];const myIt=teamItem(slot,T.id);if(!myIt){autoAdvance();bump();return}
  slotBegin(slot);
  const others=[];slot.it.forEach(it=>{if(it!==myIt)others.push(...simItemInstant(it))});
  const fs=matchesOf(myIt);prepTeams(fs);
  S.lv={id:Math.random().toString(36).slice(2,8),it:myIt,d:slot.d,min:0,st:'run',pu:null,htu:0,ms:fs.map(newLiveMatch),others};
  S.phase='live';bump();runTicker();wake();
}
function autoAdvanceSkip(){ // ไม่มีทีม: จำลองวันถัดไป 1 วัน
  if(S.day>=S.cal.length){seasonEnd();bump();return}
  const slot=S.cal[S.day];slotBegin(slot);const ms=[];slot.it.forEach(it=>ms.push(...simItemInstant(it)));postMatches(ms);S.day++;
  if(S.day>=S.cal.length)seasonEnd();bump();
}
function runTicker(){clearInterval(tickT);tickT=setInterval(tick,SPEED[S.spd??1].t)}
function tick(force){
  const V=S&&S.lv;if(!V||S.phase!=='live'){clearInterval(tickT);return}
  const now=Date.now();
  if(!force){
    if(V.st==='pause'){if(now<V.pu.until)return;V.st='run';V.pu=null;render();return}
    if(V.st==='ht'){if(now<V.htu)return;V.st='run';render();return}
  }
  if(V.st==='ft')return;
  const done=minuteAll(V);
  if(V.min===45&&!force){V.st='ht';V.htu=now+SPEED[S.spd??1].ht}
  if(done){finishRound();return}
  if(!force)render();
}
function finishRound(){
  const V=S.lv;clearInterval(tickT);V.st='ft';
  storeItem(V.it,V.ms);
  const all=V.ms.concat(V.others||[]);postMatches(all);
  S.last={it:V.it,d:V.d,m:V.ms.map(m=>{const pm=m.mid[0]*m.mid[0],qm=m.mid[1]*m.mid[1];const ps=clamp(Math.round(pm/(pm+qm||1)*100+(rnd()*6-3)),28,72);
    return{h:m.h,a:m.a,hg:m.sc[0],ag:m.sc[1],pen:m.pen,et:m.et,ev:m.ev.filter(e=>['g','r','i','y','sub','pen'].includes(e.k)),ps:[ps,100-ps],sh:m.sh,ot:m.ot,cd:m.cd}})};
  S.cal[S.day].it.forEach(it=>koNews(it));
  V.others=null;
  bump();
  clearTimeout(endT);endT=setTimeout(endLive,5000);
}
function skipAll(){if(!S||S.phase!=='live'||!S.lv)return;clearInterval(tickT);let g=0;while(S.lv&&S.lv.st!=='ft'&&g++<200)tick(true)}
function endLive(){
  if(!S||S.phase!=='live')return;clearTimeout(endT);clearInterval(tickT);
  if(S.lv&&S.lv.st!=='ft')skipAll();
  S.lv=null;S.day++;S.phase='pre';
  aiMarket();autoAdvance();
  bump();
}

function seasonEnd(){
  if(S.phase==='end')return;
  const pl=leagueTable('pl'),ch=leagueTable('ch'),ut=uclTable();
  pl.forEach((r,i)=>{T_(r.id).budget=r1(T_(r.id).budget+Math.max(10,100-i*4.5))});
  ch.forEach((r,i)=>{T_(r.id).budget=r1(T_(r.id).budget+Math.max(2,10-i*0.35))});
  const w=(c,r)=>{const R=S.cup[c].r[r];return R&&R.ties[0]&&R.ties[0].w!=null?R.ties[0].w:null};
  const fa=w('fa',5),efl=w('efl',5),ucl=w('ucl',12),cpo=w('cpo',1);
  if(fa!=null)T_(fa).budget=r1(T_(fa).budget+4);if(efl!=null)T_(efl).budget=r1(T_(efl).budget+2.5);if(ucl!=null)T_(ucl).budget=r1(T_(ucl).budget+20);
  const rel=pl.slice(-3).map(r=>r.id);const pro=[ch[0].id,ch[1].id];if(cpo!=null)pro.push(cpo);else pro.push(ch[2].id);
  const top=div=>{const ps=Object.values(S.pl).filter(p=>p.g>0&&p.t>=0&&T_(p.t).div===div).sort((a,b)=>b.g-a.g)[0];return ps?{n:ps.n,g:ps.g,t:ps.t}:null};
  S.final={pl:pl.map(r=>r.id),ch:ch.map(r=>r.id),rel,pro,fa,efl,ucl,cpo,uclNext:pl.slice(0,5).map(r=>r.id),topPl:top('pl'),topCh:top('ch')};
  S.champs.push({s:S.season,pl:pl[0].id,ch:ch[0].id,fa,efl,ucl});
  const T=myTeam();
  if(T){const pos=(T.div==='pl'?pl:ch).findIndex(r=>r.id===T.id)+1;
    S.hist.push({s:S.season,t:T.id,div:T.div,pos,fa,efl,ucl,rel:rel.includes(T.id),pro:pro.includes(T.id)})}
  S.phase='end';S.lv=null;
  addNews('🏆 '+T_(pl[0].id).name+' แชมป์พรีเมียร์ลีก '+seasonLabel(S.season)+'!');
}
function newSeason(){
  const F=S.final;S.season++;
  F.rel.forEach(id=>{T_(id).div='ch';T_(id).budget=r1(T_(id).budget+25)}); /* เงินชดเชยตกชั้น (parachute) */
  F.pro.forEach(id=>{T_(id).div='pl'});
  S.div.pl=S.teams.filter(T=>T.div==='pl').map(T=>T.id);S.div.ch=S.teams.filter(T=>T.div==='ch').map(T=>T.id);
  S.uclT=S.eu.concat(F.uclNext);
  Object.values(S.pl).forEach(p=>{
    p.ag++;p.g=0;p.as=0;p.ap=0;p.ft=100;p.ij=0;p.sp=0;if(p.ag>=29)p.pt=p.o;
    if(p.ag>=37||(p.ag>=35&&rnd()<0.4)){
      const T=S.teams[p.t];delete S.pl[p.id];
      if(T){if(p.o>=78&&T.div!=='eu')addNews('👋 '+p.n+' ('+T.sh+') ประกาศแขวนสตั๊ด');
        if(squad(T.id).length<22){const y=genFree(T.id,T.rep-12);y.pos=p.pos;y.ag=ri(17,19);y.o=clamp(T.rep-12+Math.round(gauss()*4),40,85);y.pt=clamp(y.o+ri(10,20),y.o,92);y.v=valueOf(y)}}
    }else p.v=valueOf(p);
  });
  const fr=Object.values(S.pl).filter(p=>p.t===-1);fr.sort((a,b)=>a.o-b.o).slice(0,Math.max(0,fr.length-14)).forEach(p=>delete S.pl[p.id]);
  while(Object.values(S.pl).filter(p=>p.t===-1).length<30)genFree(null,64);
  S.teams.forEach(T=>{if(!T.owner)autoXI(T);else{fixXI(T);fixBench(T)}});
  S.final=null;S.last=null;setupSeason();S.phase='pre';
  addNews('📅 เปิดฤดูกาลใหม่ '+seasonLabel(S.season));
  autoAdvance();
}

function teamOf(u){const h=S.humans[u];return h&&h.team!=null?S.teams[h.team]:null}
function myLive(T){if(!S.lv||!T)return null;const i=S.lv.ms.findIndex(m=>m.h===T.id||m.a===T.id);if(i<0)return null;const m=S.lv.ms[i];return{m,i,s:m.h===T.id?0:1}}
function act(u,m){
  if(!S||!m||typeof m!=='object')return;
  const h=S.humans[u],T=teamOf(u);
  switch(m.type){
    case 'hello':{const n=String(m.name||'ผู้จัดการ').trim().slice(0,16)||'ผู้จัดการ';if(!h)S.humans[u]={name:n,team:null,on:true};else{h.name=n;h.on=true}break}
    case 'speed':{S.spd=clamp(+m.v|0,0,2);if(S.phase==='live')runTicker();break}
    case 'pick':{if(!h)return;const X=S.teams[+m.team];if(!X||X.div==='eu')return;if(S.phase==='live')return'รอให้จบนัดนี้ก่อน';
      if(T&&T!==X)T.owner=null;X.owner=u;h.team=X.id;if(S.phase!=='lobby')addNews('👔 '+h.name+' เข้ารับตำแหน่งผู้จัดการ '+X.name);break}
    case 'lineup':{if(!T||S.phase==='live')return;if(m.form&&FORMS[m.form])T.form=m.form;if([0,1,2].includes(m.tac))T.tac=m.tac;
      const own=id=>{const p=S.pl[id];return p&&p.t===T.id};const seen=new Set();
      if(Array.isArray(m.xi))T.xi=slotsOf(T.form).map((_,i)=>{const id=m.xi[i];if(own(id)&&!seen.has(id)){seen.add(id);return id}return null});
      if(Array.isArray(m.bn))T.bn=m.bn.filter(id=>own(id)&&!seen.has(id)&&(seen.add(id),true)).slice(0,BENCH);break}
    case 'auto':{if(!T||S.phase==='live')return;autoXI(T);break}
    case 'staff':{if(!T)return;const k=m.k;if(!STAFF[k])return;const L0=T.st[k];
      if(m.down){if(L0<=0)return;T.st[k]=L0-1;addNews('📉 ลดระดับ'+STAFF[k].n+' เหลือระดับ '+(L0-1));break}
      if(L0>=5)return'ระดับสูงสุดแล้ว';const c=STAFF[k].cost[L0+1];if(T.budget<c)return'งบไม่พอ (ต้องใช้ '+money(c)+')';
      T.budget=r1(T.budget-c);T.st[k]=L0+1;addNews('⬆️ อัปเกรด'+STAFF[k].n+' เป็นระดับ '+(L0+1)+' ('+money(c)+')');break}
    case 'tp':{if(!T)return;const v=+m.v;if(!TPLAN[v])return;T.tp=v;break}
    case 'buy':{if(!T)return;if(S.phase==='live')return'ซื้อขายได้หลังจบนัด';const p=S.pl[m.pid];if(!p)return'ไม่พบนักเตะ';if(p.t===T.id)return;
      const seller=p.t>=0?S.teams[p.t]:null;
      if(seller&&squad(seller.id).length<=18)return seller.name+' ไม่ยอมปล่อยตัว (ผู้เล่นไม่พอ)';
      if(squad(T.id).length>=MAX_SQUAD)return'ทีมเต็ม '+MAX_SQUAD+' คนแล้ว';
      const price=priceOf(p);if(T.budget<price)return'งบไม่พอ';
      T.budget=r1(T.budget-price);if(seller){seller.budget=r1(seller.budget+price);seller.xi=seller.xi.map(x=>x===p.id?null:x);seller.bn=seller.bn.filter(x=>x!==p.id);fixXI(seller);fixBench(seller)}
      p.t=T.id;addNews('✍️ '+T.name+' ซื้อ '+p.n+' ('+p.pos+' '+p.o+') '+money(price));break}
    case 'sell':{if(!T)return;if(S.phase==='live')return'ซื้อขายได้หลังจบนัด';const p=S.pl[m.pid];if(!p||p.t!==T.id)return;
      if(squad(T.id).length<=MIN_SQUAD)return'ต้องมีนักเตะอย่างน้อย '+MIN_SQUAD+' คน';
      const g=r1(p.v*0.75);T.budget=r1(T.budget+g);p.t=-1;T.xi=T.xi.map(x=>x===p.id?null:x);T.bn=T.bn.filter(x=>x!==p.id);
      addNews('💸 '+T.name+' ขาย '+p.n+' ได้ '+money(g));break}
    case 'rename':{const p=S.pl[m.pid];if(!p)return;const n=String(m.n||'').replace(/\s+/g,' ').trim().slice(0,28);if(!n)return;p.n=n;p.cu=1;break}
    case 'bulk':{if(!T)return;const r=bulkRename(T,String(m.txt||''));bump();return r.msg}
    case 'start':{if(S.phase!=='lobby'||!T)return;S.phase='pre';addNews('📣 '+h.name+' เริ่มคุม '+T.name+' ฤดูกาล '+seasonLabel(S.season));autoAdvance();break}
    case 'play':{startRound();return}
    case 'skiplive':{skipAll();return}
    case 'newseason':{if(S.phase!=='end')return;newSeason();break}
    case 'ltac':{const L_=myLive(T);if(!L_||S.lv.st==='ft')return;const v=+m.v;if(![0,1,2].includes(v)||T.tac===v)return;T.tac=v;L_.m.tc[L_.s]=v;
      L_.m.ev.push({m:S.lv.min,s:L_.s,k:'tac',x:'📋 '+T.name+' เปลี่ยนแท็กติกเป็น “'+TAC[v]+'”'});break}
    case 'lform':{const L_=myLive(T);if(!L_||S.lv.st==='ft'||!FORMS[m.f]||T.form===m.f)return;T.form=m.f;
      L_.m.sl[L_.s]=slotsOf(m.f);L_.m.on[L_.s]=reslot(L_.m.on[L_.s],m.f,L_.m.out);
      L_.m.ev.push({m:S.lv.min,s:L_.s,k:'tac',x:'📋 '+T.name+' เปลี่ยนแผนเป็น '+m.f});break}
    case 'sub':{const L_=myLive(T);if(!L_)return;const M=L_.m,s=L_.s;if(S.lv.st==='ft'||M.done)return'จบเกมแล้ว';
      const lim=MAX_SUBS+(M.et?1:0);if(M.sb[s]>=lim)return'เปลี่ยนตัวครบ '+lim+' คนแล้ว';
      if(!M.on[s].includes(m.off)||M.out.includes(m.off))return'ผู้เล่นคนนี้ไม่ได้อยู่ในสนาม';
      if(!M.bn[s].includes(m.on))return'ไม่มีผู้เล่นคนนี้บนม้านั่งสำรอง';
      doSub(M,s,m.off,m.on,'',S.lv.min);break}
    case 'gkfield':{const L_=myLive(T);if(!L_)return;const M=L_.m;if(S.lv.st==='ft'||M.done)return'จบเกมแล้ว';
      if(!gkField(M,L_.s,m.pid,S.lv.min,false))return'ย้ายผู้เล่นคนนี้ไม่ได้';break}
    case 'gksub':{const L_=myLive(T);if(!L_)return;const M=L_.m,s=L_.s;if(S.lv.st==='ft'||M.done)return'จบเกมแล้ว';
      const lim=MAX_SUBS+(M.et?1:0);if(M.sb[s]>=lim)return'เปลี่ยนตัวครบ '+lim+' คนแล้ว';
      if(!gkSub(M,s,m.off,m.on,S.lv.min))return'เปลี่ยนตัวไม่สำเร็จ';break}
    case 'pause':{if(!S.lv||S.lv.st!=='run')return;S.lv.st='pause';S.lv.pu={by:h?h.name:'',u,until:Date.now()+864e5};break}
    case 'resume':{if(!S.lv||S.lv.st!=='pause')return;S.lv.pu.until=Date.now();break}
    default:return;
  }
  bump();
}
function priceOf(p){return p.t>=0?r1(p.v*1.3):r1(p.v)}
function bulkRename(T,txt){
  const map={gk:'GK',df:'DF',mf:'MF',fw:'FW','ผู้รักษาประตู':'GK','ประตู':'GK','กองหลัง':'DF','กองกลาง':'MF','กองหน้า':'FW'};const order={GK:0,DF:1,MF:2,FW:3};
  const sq=squad(T.id).sort((a,b)=>order[a.pos]-order[b.pos]||b.o-a.o);const used=new Set();let n=0,skip=0;
  txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let pos=null,name=line.replace(/^\d+[\s.)\-]*/,'');const mm=name.match(/^(GK|DF|MF|FW|ผู้รักษาประตู|ประตู|กองหลัง|กองกลาง|กองหน้า)[\s:.\-]+/i);
    if(mm){pos=map[mm[1].toLowerCase()]||map[mm[1]];name=name.slice(mm[0].length)}
    name=name.replace(/\s+/g,' ').trim().slice(0,28);if(!name){skip++;return}
    const p=sq.find(q=>!used.has(q.id)&&(!pos||q.pos===pos));if(!p){skip++;return}used.add(p.id);p.n=name;p.cu=1;n++});
  return{msg:'เปลี่ยนชื่อแล้ว '+n+' คน'+(skip?' (ข้าม '+skip+' บรรทัด)':'')};
}

function togglePlayer(pid){
  const T=myTeam();if(!T)return;const p=S.pl[pid];if(!p)return;const sl=slotsOf(T.form);const at=T.xi.indexOf(pid);
  if(at>=0){lineupChange(X=>{X.xi[at]=null});return}
  if(!avail(p)){toast(p.ij?'บาดเจ็บอยู่':'ติดโทษแบน');return}
  let i=sl.findIndex((s,k)=>s===p.pos&&!S.pl[T.xi[k]]);
  if(i<0){let wo=999;sl.forEach((s,k)=>{if(s===p.pos){const q=S.pl[T.xi[k]];const sc=q?effScore(q):-1;if(sc<wo){wo=sc;i=k}}})}
  if(i<0)i=sl.findIndex((s,k)=>!S.pl[T.xi[k]]&&(s==='GK')===(p.pos==='GK'));
  if(i<0){toast('ไม่มีตำแหน่งว่าง');return}
  lineupChange(X=>{const old=X.xi[i];const bi=X.bn.indexOf(pid);X.xi[i]=pid;
    if(bi>=0){if(old)X.bn[bi]=old;else X.bn.splice(bi,1)}});
}
function toggleBench(pid){
  const T=myTeam();if(!T)return;const p=S.pl[pid];if(!p)return;
  if(T.bn.includes(pid)){lineupChange(X=>{X.bn=X.bn.filter(x=>x!==pid)});return}
  if(!avail(p)){toast(p.ij?'บาดเจ็บอยู่':'ติดโทษแบน');return}
  if(T.bn.length>=BENCH){toast('ม้านั่งสำรองเต็ม '+BENCH+' คนแล้ว');return}
  lineupChange(X=>{const at=X.xi.indexOf(pid);if(at>=0)X.xi[at]=null;X.bn.push(pid)});
}

/* ==========================================================
   เสียง (สังเคราะห์ด้วย Web Audio — ไม่ต้องมีไฟล์เสียง)
   ========================================================== */
const AU={ctx:null,master:null,mus:null,sfx:null,amb:null,nb:null,ambSrc:null,mode:null,
  musOn:false,step:0,next:0,loop:0,timer:null,bpm:118};
AU.unlock=function(){
  try{
    if(!AU.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const c=AU.ctx=new AC();
      AU.master=c.createGain();AU.master.connect(c.destination);
      AU.mus=c.createGain();AU.mus.gain.value=0.55;AU.mus.connect(AU.master);
      AU.sfx=c.createGain();AU.sfx.gain.value=0.9;AU.sfx.connect(AU.master);
      AU.amb=c.createGain();AU.amb.gain.value=0;AU.amb.connect(AU.master);
      const n=c.sampleRate*2,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;AU.nb=b;
      AU.applyVol();}
    if(AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume();
    AU.sync();
  }catch(e){}
};
AU.applyVol=function(){if(!AU.ctx)return;const t=AU.ctx.currentTime;AU.master.gain.setTargetAtTime(UI.mute?0:0.9,t,0.05);AU.sfx.gain.setTargetAtTime(UI.sound?0.9:0,t,0.05)};
AU.tone=function(f,t,d,o){o=o||{};const c=AU.ctx;const os=c.createOscillator(),g=c.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
  if(o.slide)os.frequency.exponentialRampToValueAtTime(o.slide,t+d);const a=o.a||0.01,r=Math.min(o.r||0.1,d*0.8),G=o.g||0.2;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G,t+a);g.gain.setValueAtTime(G,t+Math.max(a,d-r));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  let node=os;if(o.lp){const f2=c.createBiquadFilter();f2.type='lowpass';f2.frequency.value=o.lp;os.connect(f2);node=f2}
  node.connect(g).connect(o.dest||AU.sfx);os.start(t);os.stop(t+d+0.05);return os};
AU.noise=function(t,d,o){o=o||{};const c=AU.ctx;const s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;const f=c.createBiquadFilter();f.type=o.type||'bandpass';
  f.frequency.setValueAtTime(o.f||1000,t);if(o.slide)f.frequency.exponentialRampToValueAtTime(o.slide,t+d);f.Q.value=o.q||1;
  const g=c.createGain();const a=o.a||0.01,r=Math.min(o.r||0.1,d*0.9),G=o.g||0.3;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(G,t+a);g.gain.setValueAtTime(G,t+Math.max(a,d-r));g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(f).connect(g).connect(o.dest||AU.sfx);s.start(t,Math.random()*1.5);s.stop(t+d+0.05)};
AU.ok=()=>AU.ctx&&AU.ctx.state==='running'&&UI.sound&&!UI.mute;
AU.whistle=function(n){if(!AU.ok())return;const c=AU.ctx;let t=c.currentTime+0.02;const pat=n===3?[0.22,0.22,0.9]:n===2?[0.25,0.25]:[0.35];
  pat.forEach(d=>{const o=AU.tone(2750,t,d,{g:0.12,a:0.01,r:0.05});const l=c.createOscillator(),lg=c.createGain();l.frequency.value=32;lg.gain.value=140;l.connect(lg).connect(o.frequency);l.start(t);l.stop(t+d);t+=d+0.12})};
AU.cheer=function(){if(!AU.ok())return;const t=AU.ctx.currentTime+0.02;
  [[650,0.6,0.5],[1300,0.9,0.42],[2600,1.4,0.22]].forEach(([f,q,g])=>AU.noise(t,4.2,{f,q,g,a:0.35,r:2.6}));
  AU.noise(t+0.2,3.5,{f:900,q:3,g:0.18,a:0.6,r:2,slide:1300});
  [0,0.38,0.76].forEach((o,i)=>{[349,440,523].forEach(f=>AU.tone(f,t+0.15+o,i===2?0.7:0.3,{type:'sawtooth',g:0.05,a:0.02,r:0.08,lp:2200}))});
  [0,0.18].forEach(o=>AU.tone(120,t+o,0.35,{g:0.5,slide:45,a:0.005,r:0.3}))};
AU.groan=function(){if(!AU.ok())return;const t=AU.ctx.currentTime+0.02;
  AU.noise(t,2.2,{f:520,q:1.2,g:0.4,a:0.2,r:1.4,slide:220});AU.noise(t,2,{f:1100,q:1,g:0.15,a:0.25,r:1.3,slide:500})};
AU.boo=function(){if(!AU.ok())return;const t=AU.ctx.currentTime+0.3;
  AU.noise(t,1.8,{f:320,q:3,g:0.4,a:0.3,r:0.9});AU.tone(140,t,1.6,{type:'sawtooth',g:0.05,a:0.3,r:0.8,lp:500})};
AU.ding=function(){if(!AU.ok())return;const t=AU.ctx.currentTime+0.02;AU.tone(880,t,0.25,{g:0.15});AU.tone(1318,t+0.12,0.4,{g:0.12})};
AU.ooh=function(){if(!AU.ok())return;const t=AU.ctx.currentTime+0.02;AU.noise(t,1.3,{f:700,q:2.5,g:0.25,a:0.15,r:0.9,slide:450})};
/* ---- บรรยากาศกองเชียร์ระหว่างแข่ง ---- */
AU.ambStart=function(){if(!AU.ctx||AU.ambSrc)return;const c=AU.ctx;const s=c.createBufferSource();s.buffer=AU.nb;s.loop=true;
  const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=700;f.Q.value=0.5;const g=c.createGain();g.gain.value=0.07;
  const l=c.createOscillator(),lg=c.createGain();l.frequency.value=0.13;lg.gain.value=0.03;l.connect(lg).connect(g.gain);l.start();
  s.connect(f).connect(g).connect(AU.amb);s.start();AU.ambSrc=[s,l]};
AU.ambStop=function(){if(!AU.ambSrc)return;AU.ambSrc.forEach(x=>{try{x.stop()}catch(e){}});AU.ambSrc=null};
/* ---- เพลงประกอบ (วนลูป 4 ห้อง C-G-Am-F) ---- */
const MCH=[[36,[60,64,67]],[43,[59,62,67]],[45,[60,64,69]],[41,[60,65,69]]];
const MMEL=[[72,0,72,0,76,0,79,0,79,0,76,0,74,0,72,0],[74,0,74,0,79,0,83,0,81,0,79,0,74,0,0,0],[72,0,72,0,76,0,81,0,79,0,76,0,72,0,69,0],[69,0,72,0,77,0,76,0,74,0,72,0,71,0,0,0]];
const mtof=n=>440*Math.pow(2,(n-69)/12);
AU.musStart=function(){if(!AU.ctx||AU.musOn)return;AU.musOn=true;AU.next=AU.ctx.currentTime+0.1;AU.timer=setInterval(AU.sched,25)};
AU.musStop=function(){AU.musOn=false;clearInterval(AU.timer)};
AU.sched=function(){const c=AU.ctx;if(!c||c.state!=='running')return;const sp=60/AU.bpm/4;
  while(AU.next<c.currentTime+0.12){AU.playStep(AU.step,AU.next);AU.next+=sp;AU.step=(AU.step+1)%64;if(AU.step===0)AU.loop++}};
AU.playStep=function(st,t){
  const D=AU.mus,bar=st>>4,s=st&15,[root,ch]=MCH[bar],sp=60/AU.bpm/4;
  if(s%4===0)AU.tone(140,t,0.28,{g:0.5,slide:42,a:0.003,r:0.25,dest:D});
  if(s===4||s===12){AU.noise(t,0.16,{type:'highpass',f:1600,g:0.16,a:0.002,r:0.12,dest:D});AU.tone(190,t,0.1,{g:0.1,a:0.002,r:0.08,dest:D})}
  if(s%2===0)AU.noise(t,0.04,{type:'highpass',f:7500,g:s%4===2?0.07:0.035,a:0.001,r:0.03,dest:D});
  if(s%2===0)AU.tone(mtof(root+(s%8===6?7:0)),t,sp*1.7,{type:'sawtooth',g:0.07,a:0.005,r:0.08,lp:700,dest:D});
  if(s===0||s===8)ch.forEach(n=>AU.tone(mtof(n),t,sp*7.6,{type:'triangle',g:0.028,a:0.04,r:0.25,dest:D}));
  if(s===2||s===6||s===10||s===14)ch.forEach(n=>AU.tone(mtof(n+12),t,sp*0.8,{type:'square',g:0.012,a:0.003,r:0.05,lp:2500,dest:D}));
  const mn=MMEL[bar][s];if(mn&&AU.loop%4!==3)AU.tone(mtof(mn),t,sp*1.8,{type:'square',g:0.035,a:0.01,r:0.1,lp:2800,dest:D});
};
AU.sync=function(){
  if(!AU.ctx)return;AU.applyVol();
  const live=!!(S&&S.phase==='live'&&S.lv&&S.lv.st!=='ft');
  const wantMus=UI.music&&!UI.mute&&!live,wantAmb=UI.sound&&!UI.mute&&live;
  if(wantMus)AU.musStart();else AU.musStop();
  if(wantAmb){AU.ambStart();AU.amb.gain.setTargetAtTime(S.lv.st==='run'?1:0.45,AU.ctx.currentTime,0.4)}else{AU.amb.gain.setTargetAtTime(0,AU.ctx.currentTime,0.3);if(!live&&AU.ambSrc&&!AU.ambT)AU.ambT=setTimeout(()=>{AU.ambT=null;if(!(S&&S.phase==='live'))AU.ambStop()},1200)}
};

const POPQ=[];let popT=null,popCur=null;
function pop(o){if(POPQ.length>=4)POPQ.splice(POPQ.findIndex(x=>!x.big)>=0?POPQ.findIndex(x=>!x.big):0,1);POPQ.push(o);if(!popCur)nextPop()}
function nextPop(){
  clearTimeout(popT);const el=$('#pop');const o=POPQ.shift();
  if(!o){popCur=null;el.className='';el.innerHTML='';return}
  popCur=o;el.className='';void el.offsetWidth;el.innerHTML=popHtml(o);el.className='on '+(o.cls||'');
  if(navigator.vibrate&&o.vib)try{navigator.vibrate(o.vib)}catch(e){}
  const ms=o.ms||5000;popT=setTimeout(()=>{el.classList.add('out');popT=setTimeout(nextPop,350)},ms);
}

function teamSchedule(T){
  const out=[];
  S.cal.forEach((sl,i)=>{sl.it.forEach(it=>{
    let f=null,res=null;
    if(it.c==='pl'||it.c==='ch'){if(T.div!==it.c)return;const p=S.lgx[it.c].fx[it.r].find(([h,a])=>h===T.id||a===T.id);if(!p)return;f={h:p[0],a:p[1]};const rd=S.lgx[it.c].res[it.r];res=rd&&rd.find(x=>x.h===f.h)}
    else if(it.c==='ucl'&&it.r<8){if(!S.uclT.includes(T.id))return;const p=S.cup.ucl.fx[it.r].find(([h,a])=>h===T.id||a===T.id);if(!p)return;f={h:p[0],a:p[1]};const rd=S.cup.ucl.res[it.r];res=rd&&rd.find(x=>x.h===f.h)}
    else{const R=S.cup[it.c].r[it.r];if(!R)return;const t=R.ties.find(x=>x.h===T.id||x.a===T.id);if(!t)return;f=t;res=t.w!=null?t:null}
    out.push({i,d:sl.d,it,f,res});
  })});
  return out;
}

/* ==========================================================

  // จุดเริ่ม: ตำแหน่งตามแผน

function mvLineInfo(m,s){const sl=m.sl[s];const cnt={},idx=[];sl.forEach((r,i)=>{idx[i]=cnt[r]=(cnt[r]||0);cnt[r]++});return{sl,cnt,idx}}

/* ---------- ลำดับการเล่น ---------- */

    case 'r':st.marks.push({id:e.p,i:'🟥',t:2600});st.ov={txt:'🟥 ใบแดง! '+pn(e.p),t:2200,c:'#dc2626'};break;
    case 'i':st.marks.push({id:e.p,i:'🚑',t:2600});st.ov={txt:'🚑 '+pn(e.p)+' บาดเจ็บ',t:1800};break;

    case 'tac':st.ov={txt:e.x.slice(0,46),t:1500};break;

    case 'et':st.ov={txt:'⏱️ ต่อเวลาพิเศษ',t:2500};break;

function mvStart(m,st,a){

    if(a.res==='goal')a.tg={x:gx+(atkR?0.018:-0.018),y:0.5+(rnd()-0.5)*0.09};
    else if(a.res==='save')a.tg={x:atkR?0.955:0.045,y:0.5+(rnd()-0.5)*0.1};
    else a.tg={x:gx+(atkR?0.03:-0.03),y:rnd()<0.5?0.5-0.11-rnd()*0.12:0.5+0.11+rnd()*0.12};

  if(a.k==='run'){const s=mvSideOf(m,a.who);if(s>=0){const fx=0.8+rnd()*0.07,fy=0.5+(rnd()-0.5)*0.32;st.focus[a.who]={x:s===0?fx:1-fx,y:fy,t:2600}}}

MV.frame=function(now){
  MV.raf=0;const host=document.getElementById('pitchHost');if(!host||!MV.cv||!MV.cv.isConnected||!S||!S.lv)return;
  const dt=Math.min(80,now-MV.lt);MV.lt=now;

  let st=MV.st;if(!st||st.key!==V.id+':'+idx){st=MV.st=mvNew(V,idx,m)}
  const frozen=V.st==='pause'||V.st==='ht'||V.st==='ft'||m.done;
  const spd=(SPEED[S.spd??1].t<500?1.35:SPEED[S.spd??1].t>900?0.85:1)*(st.q.length>8?1.6:1);
  if(m.ev.length>st.evSeen){m.ev.slice(st.evSeen).forEach(e=>mvEventSeq(m,st,e));st.evSeen=m.ev.length}

    let tg=mvBase(m,s,i,st,now);const f=st.focus[id];if(f){tg=f;f.t-=dt;if(f.t<=0)delete st.focus[id]}
    if(st.cele&&st.cele.s===s&&i>0){const c=st.P[st.cele.who];if(c)tg={x:c.x+Math.cos(i*1.3)*0.05,y:c.y+Math.sin(i*1.3)*0.07}}
    if(id===st.holder&&!(st.act&&st.act.k==='pass')){st.ball.x+=(P.x+(s===0?0.012:-0.012)-st.ball.x)*0.35;st.ball.y+=(P.y+0.008-st.ball.y)*0.35}
    const sp=(frozen&&!st.act?0.02:0.06)*(dt/16);P.x+=(tg.x-P.x)*Math.min(1,sp);P.y+=(tg.y-P.y)*Math.min(1,sp)});
  if(st.ov){st.ov.t-=dt;if(st.ov.t<=0)st.ov=null}
  st.marks=st.marks.filter(x=>(x.t-=dt)>0);
  mvDraw(m,st,V,frozen);
  MV.raf=requestAnimationFrame(MV.frame);
};
/* ---------- วาด ---------- */
function mvKit(T,s,other){
  let c=T.c1;const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
  const d=(a,b)=>{const x=hex(a),y=hex(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
  if(d(c,'#1d6b3a')<90)c=T.c2;
  if(s===1&&d(c,other)<110)c=d(T.c2,other)>110?T.c2:'#f8fafc';
  return c;
}
function mvDraw(m,st,V,frozen){
  const c=MV.ctx,W=MV.w,H=MV.h;if(!c)return;
  const mg=10,fx=mg,fy=mg+12,fw=W-mg*2,fh=H-mg*2-12;const X=x=>fx+x*fw,Y=y=>fy+y*fh;
  c.clearRect(0,0,W,H);
  c.fillStyle='#0e3b22';c.fillRect(0,0,W,H);
  for(let i=0;i<12;i++){c.fillStyle=i%2?'#1c6e3c':'#1a6536';c.fillRect(fx+fw*i/12,fy,fw/12+0.5,fh)}
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=1.4;c.strokeRect(fx,fy,fw,fh);
  c.beginPath();c.moveTo(X(0.5),fy);c.lineTo(X(0.5),fy+fh);c.stroke();
  c.beginPath();c.arc(X(0.5),Y(0.5),fh*0.16,0,Math.PI*2);c.stroke();
  c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.arc(X(0.5),Y(0.5),1.6,0,Math.PI*2);c.fill();
  [[0,1],[1,-1]].forEach(([gx,dir])=>{
    c.strokeRect(gx?X(1-0.155):fx,Y(0.2),fw*0.155,fh*0.6);c.strokeRect(gx?X(1-0.055):fx,Y(0.36),fw*0.055,fh*0.28);
    c.beginPath();c.arc(X(gx?0.895:0.105),Y(0.5),1.5,0,Math.PI*2);c.fill();
    c.beginPath();c.arc(X(gx?0.895:0.105),Y(0.5),fh*0.15,gx?Math.PI*0.62:-Math.PI*0.38,gx?Math.PI*1.38:Math.PI*0.38);c.stroke();
    c.save();c.fillStyle='rgba(255,255,255,.18)';c.strokeStyle='rgba(255,255,255,.9)';const gxp=gx?fx+fw:fx-7;c.fillRect(gxp,Y(0.43),7,fh*0.14);c.strokeRect(gxp,Y(0.43),7,fh*0.14);c.restore();
  });
  // หัวสนาม: ทีม + สกอร์
  const TH=T_(m.h),TA=T_(m.a);const kH=mvKit(TH,0,''),kA=mvKit(TA,1,kH);
  c.font='600 11px Kanit,sans-serif';c.textBaseline='middle';
  c.fillStyle=kH;c.fillRect(mg,4,8,8);c.fillStyle='#ecf7ef';c.textAlign='left';c.fillText(TH.sh+' ▶',mg+12,9);
  c.fillStyle=kA;c.fillRect(W-mg-8,4,8,8);c.fillStyle='#ecf7ef';c.textAlign='right';c.fillText('◀ '+TA.sh,W-mg-12,9);
  c.textAlign='center';c.fillStyle='#facc15';c.fillText(m.sc[0]+' - '+m.sc[1]+'  ·  '+clockLabel(V),W/2,9);
  // นักเตะ
  const R=Math.max(5.5,W/54);const hm=st.holder;
  for(let s=0;s<2;s++){const kit=s?kA:kH;
    m.on[s].forEach((id,i)=>{const P=st.P[id];if(!id||!P)return;const dead=m.out.includes(id);if(dead&&!st.marks.some(x=>x.id===id))return;
      const gk=i===0;const col=gk?(s?'#c084fc':'#fde047'):kit;const x=X(P.x),y=Y(P.y);
      c.globalAlpha=dead?0.35:1;
      c.fillStyle='rgba(0,0,0,.28)';c.beginPath();c.ellipse(x+1.5,y+R*0.8,R*0.9,R*0.4,0,0,Math.PI*2);c.fill();
      c.fillStyle=col;c.beginPath();c.arc(x,y,R,0,Math.PI*2);c.fill();
      c.lineWidth=id===hm?2.2:1.2;c.strokeStyle=id===hm?'#ffffff':'rgba(0,0,0,.55)';c.stroke();
      c.fillStyle=lum(col)>0.6?'#111':'#fff';c.font='700 '+Math.round(R*1.05)+'px Kanit,sans-serif';c.fillText(String(i+1),x,y+0.5);
      c.globalAlpha=1;
    })}
  // บอล
  const bx=X(st.ball.x),by=Y(st.ball.y),bz=st.ball.z*14;
  c.fillStyle='rgba(0,0,0,.35)';c.beginPath();c.ellipse(bx+1,by+2,3.6,1.8,0,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.strokeStyle='#111';c.lineWidth=1;c.beginPath();c.arc(bx,by-bz,3.4+st.ball.z*1.2,0,Math.PI*2);c.fill();c.stroke();
  // ชื่อคนถือบอล
  if(hm&&st.P[hm]&&S.pl[hm]){const P=st.P[hm];const t=shortN(S.pl[hm]);c.font='600 10px Kanit,sans-serif';const tw=c.measureText(t).width+8;
    const x=clamp(X(P.x),tw/2+2,W-tw/2-2),y=Y(P.y)+R+8;c.fillStyle='rgba(0,0,0,.6)';mvRR(c,x-tw/2,y-6,tw,12,6);c.fill();c.fillStyle='#fff';c.fillText(t,x,y)}
  // ไอคอนเหตุการณ์เหนือหัว
  c.font=Math.round(R*1.6)+'px sans-serif';
  st.marks.forEach(mk=>{const P=st.P[mk.id];if(P)c.fillText(mk.i,X(P.x),Y(P.y)-R-7)});
  // ข้อความกลางจอ
  const ov=st.ov||(V.st==='pause'?{txt:'⏸️ หยุดเกม'}:V.st==='ht'?{txt:'⏸️ พักครึ่ง'}:null);
  if(ov){c.font=(ov.big?'700 22px':'600 14px')+' Kanit,sans-serif';const tw=Math.min(W-30,c.measureText(ov.txt).width+24),th=ov.big?38:26;
    c.fillStyle=ov.big?'rgba(250,204,21,.94)':ov.c?'rgba(185,28,28,.92)':'rgba(0,0,0,.72)';mvRR(c,W/2-tw/2,fy+fh/2-th/2,tw,th,th/2);c.fill();
    c.fillStyle=ov.big?'#2b2100':'#fff';c.fillText(ov.txt,W/2,fy+fh/2+1,W-40)}
}
function mvRR(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
