<!doctype html>

<title>KG ผู้จัดการทีม ไทยลีก</title>

<style>
:root{color-scheme:dark;--bg:#07140d;--pan:#0f2418;--pan2:#163222;--line:#244a33;--tx:#ecf7ef;--mut:#8db59a;--ac:#22c55e;--ac2:#facc15;--bad:#f87171;--blue:#38bdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Kanit,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#0d2a19,#0a1f13);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;gap:10px;align-items:center}
.top .tt{flex:1;min-width:0}
.top .tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.top .tt small{color:var(--mut);font-size:12px}
.money{font-weight:600;color:var(--ac2);text-align:right;font-size:14px;white-space:nowrap}
.money small{display:block;color:var(--mut);font-weight:400;font-size:11px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ac);margin-right:4px;vertical-align:middle}
.dot.off{background:var(--bad)}
.badge{border-radius:50%;display:inline-grid;place-items:center;font-weight:700;border:2px solid;flex:none;letter-spacing:.3px;vertical-align:middle}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0a1d12;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
.nav button{flex:1;max-width:112px;background:none;border:0;color:var(--mut);font-size:12px;padding:7px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
.nav button.on{color:var(--ac)}
.nav i{font-style:normal;font-size:20px;line-height:1.2}
.sec{padding:12px 16px}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:600}
.mut{color:var(--mut)}
.sm{font-size:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:11px 14px;background:var(--pan2);border:1px solid var(--line);cursor:pointer;font-weight:500;min-height:44px}
.btn.pri{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:600}
.btn.gold{background:var(--ac2);color:#2b2100;border-color:var(--ac2);font-weight:600}
.btn.red{background:#3a1515;border-color:#7f2a2a;color:#fecaca}
.btn.blk{display:flex;width:100%}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}

.row{display:flex;gap:8px;align-items:center}

.grow{flex:1}
input.in,textarea.in,select.in{width:100%;background:#0a1c11;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;outline:none}

.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--pan2);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#04220f;border-color:var(--ac);font-weight:600}
.seg{display:flex;background:#0a1c11;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}

.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.vs .mid{font-size:28px;font-weight:700;min-width:90px}

.form{display:inline-flex;gap:3px}

.hu{display:flex;align-items:center;gap:8px;font-size:14px}

.pitch:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid rgba(255,255,255,.22)}

.tb tr.hum td.t b{color:var(--ac)}
.tb td.pts{font-weight:700}
.zone1 td:first-child{box-shadow:3px 0 0 var(--ac) inset}
.zoneR td:first-child{box-shadow:3px 0 0 var(--bad) inset}
.live .clock{font-size:13px;color:var(--ac2);font-weight:600}
.feed{max-height:42vh;overflow-y:auto;display:flex;flex-direction:column;gap:2px}
.ev{font-size:14px;padding:6px 8px;border-radius:8px;background:#0b1d12;display:flex;gap:8px}
.ev .m{color:var(--mut);min-width:28px;font-size:12px;padding-top:2px}
.ev.g{background:#173d25;font-weight:600}
.ev.r{background:#3b1717}
.mini{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 0;border-bottom:1px solid #1b3826}
.mini:last-child{border-bottom:0}
.mini .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .tn.r{text-align:right}
.mini .sc{min-width:40px;text-align:center;font-weight:700}
.flash{animation:fl 1.2s}
@keyframes fl{0%,40%{background:#facc15;color:#2b2100}100%{background:transparent}}
.code{font-size:32px;font-weight:700;letter-spacing:6px;text-align:center;color:var(--ac2)}
.bar{height:8px;border-radius:4px;background:#0a1c11;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.stat{display:flex;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.stat b{min-width:28px;text-align:center}
.stat .bar{flex:1}
#modal .bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal .sh{background:var(--pan);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
#modal h2{margin:0 0 4px;font-size:19px}
.kv{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:10px 0}
.kv div{background:#0a1c11;border-radius:10px;padding:8px;text-align:center}
.kv b{display:block;font-size:17px}
.kv small{color:var(--mut);font-size:11px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(30px);opacity:0;background:#111827;border:1px solid #374151;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:14px}
#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.champ{text-align:center;padding:18px 10px;background:radial-gradient(circle at 50% 0,#4d3b06,#0f2418 70%);border:1px solid #7a5f10}
.champ .tro{font-size:54px}
.warn{background:#3a2a07;border:1px solid #7a5f10;color:#fde68a;border-radius:10px;padding:8px 10px;font-size:13px;margin-bottom:10px}
.foot{text-align:center;color:#4f7a5e;font-size:11px;padding:18px 0 6px}
</style>

const rnd=()=>Math.random();
const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const r1=v=>Math.round(v*10)/10;
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const money=v=>(Math.round(v*10)/10).toLocaleString('th-TH',{maximumFractionDigits:1});
const slotsOf=f=>{const [d,m,w]=FORMS[f]||FORMS['4-4-2'];return ['GK',...Array(d).fill('DF'),...Array(m).fill('MF'),...Array(w).fill('FW')]};
const seasonLabel=s=>s+'/'+String((s+1)%100).padStart(2,'0');
function lum(hex){const n=parseInt(hex.slice(1),16);const r=n>>16&255,g=n>>8&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255}

/* ==========================================================
   GAME STATE (โฮสต์เป็นเจ้าของ S ตัวจริง ผู้เล่นอื่นได้สำเนา)
   ========================================================== */
let S=null;

function newName(f){
  for(let k=0;k<40;k++){const n=f?pick(FN1)+' '+pick(FN2):pick(TH1)+' '+pick(TH2);
    if(!Object.values(S.pl).some(p=>p.n===n))return n}
  return (f?pick(FN1)+' '+pick(FN2):pick(TH1)+' '+pick(TH2))+' '+ri(2,9);
}
function valueOf(p){
  const b=Math.max(0.15,Math.pow(Math.max(0,p.o-42)/10,2.5));
  const af=p.ag<=21?1.35:p.ag<=24?1.2:p.ag<=28?1:p.ag<=30?0.8:p.ag<=32?0.55:0.35;
  const pb=1+Math.max(0,p.pt-p.o)*0.03;
  return r1(b*af*pb);
}
function mkPlayer(t,pos,o,ag,f){
  const id=S.nid++;o=clamp(Math.round(o),40,92);
  const pt=clamp(o+(ag<=20?ri(6,16):ag<=23?ri(3,10):ag<=26?ri(0,4):0),o,94);
  const p={id,n:newName(f),pos,o,pt,ag,ft:100,ij:0,sp:0,t,g:0,as:0,ap:0,f:f?1:0,v:0};
  p.v=valueOf(p);S.pl[id]=p;return p;
}
function genSquad(T){
  const R=T.rep, plan=[['GK',3,1],['DF',7,4],['MF',7,4],['FW',5,2]];
  const made=[];
  plan.forEach(([pos,n,st])=>{for(let i=0;i<n;i++){const starter=i<st;
    const o=starter?R-1+gauss()*3:R-8+gauss()*4;const ag=starter?ri(22,32):ri(18,34);
    made.push(mkPlayer(T.id,pos,o,ag,0))}});
  // นักเตะต่างชาติ 5 คน (เน้นตัวจริงที่ไม่ใช่ GK)
  shuffle(made.filter(p=>p.pos!=='GK')).sort((a,b)=>b.o-a.o).slice(0,8).sort(()=>rnd()-.5).slice(0,5)
    .forEach(p=>{p.f=1;p.n=newName(1);p.o=clamp(p.o+2,40,92);p.pt=Math.max(p.pt,p.o);p.v=valueOf(p)});
}
function genFree(){
  const pos=pick(['GK','DF','DF','DF','MF','MF','MF','FW','FW']);const f=rnd()<0.3;
  const ag=ri(19,34);const o=clamp(56+gauss()*6+(f?3:0),46,76);mkPlayer(-1,pos,o,ag,f);
}
function squad(t){return Object.values(S.pl).filter(p=>p.t===t)}
function startBudget(rep){return r1(Math.max(10,(rep-58)*3.8)+5)}
function makeFixtures(n){
  const arr=shuffle([...Array(n).keys()]);const rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){let h=arr[i],a=arr[n-1-i];if(i===0?r%2:i%2)[h,a]=[a,h];m.push([h,a])}rounds.push(m);arr.splice(1,0,arr.pop())}
  return rounds.concat(shuffle(rounds.map(m=>m.map(([h,a])=>[a,h]))));
}
function addNews(txt){S.news.unshift({r:S.round,txt});if(S.news.length>40)S.news.length=40}

function newGame(code,solo){
  S={v:VER,code,solo:!!solo,host:uid,phase:'lobby',season:2026,round:0,nid:1,teams:[],pl:{},fx:[],res:[],last:null,humans:{},news:[],live:null,seq:0,champs:[],final:null};
  TEAMS.forEach((t,i)=>{const T={id:i,name:t[0],sh:t[1],c1:t[2],c2:t[3],rep:t[4],budget:startBudget(t[4]),form:pick(['4-4-2','4-3-3','4-4-2','4-5-1','3-5-2']),tac:1,xi:[],owner:null};S.teams.push(T);genSquad(T);autoXI(T)});
  for(let k=0;k<26;k++)genFree();
  S.fx=makeFixtures(16);
  addNews('ยินดีต้อนรับสู่ไทยลีก 1 ฤดูกาล '+seasonLabel(S.season)+' 🇹🇭');
}

/* ---------------- ตัวจริง 11 คน ---------------- */
const effScore=p=>p.o*(0.72+0.28*p.ft/100);
function avail(p){return p&&!p.ij&&!p.sp}
function autoXI(T){
  const sl=slotsOf(T.form);const pool=squad(T.id).filter(avail).sort((a,b)=>effScore(b)-effScore(a));
  const used=new Set();const xi=sl.map(()=>null);
  sl.forEach((pos,i)=>{const p=pool.find(q=>q.pos===pos&&!used.has(q.id));if(p){xi[i]=p.id;used.add(p.id)}});
  sl.forEach((pos,i)=>{if(xi[i]==null){const p=pool.find(q=>!used.has(q.id)&&(pos==='GK')===(q.pos==='GK'))||pool.find(q=>!used.has(q.id));if(p){xi[i]=p.id;used.add(p.id)}}});
  T.xi=xi;
}
function fixXI(T){
  const sl=slotsOf(T.form);const used=new Set();
  let xi=sl.map((_,i)=>{const id=T.xi[i];const p=S.pl[id];if(p&&p.t===T.id&&avail(p)&&!used.has(id)){used.add(id);return id}return null});
  const pool=squad(T.id).filter(p=>avail(p)&&!used.has(p.id)).sort((a,b)=>effScore(b)-effScore(a));
  sl.forEach((pos,i)=>{if(xi[i]==null){const j=pool.findIndex(q=>q.pos===pos);const k=j>=0?j:pool.findIndex(q=>(pos==='GK')===(q.pos==='GK'));const kk=k>=0?k:0;if(pool.length){xi[i]=pool[kk].id;pool.splice(kk,1)}}});
  T.xi=xi;
}

/* ---------------- จำลองแมตช์ ---------------- */
function power(T,home){
  const sl=slotsOf(T.form);let gk=35;const df=[],mf=[],fw=[];
  T.xi.forEach((id,i)=>{const p=S.pl[id];if(!p)return;const s=sl[i];let e=effScore(p);
    if(p.pos!==s)e-=(s==='GK'||p.pos==='GK')?25:7;
    if(s==='GK')gk=e;else if(s==='DF')df.push(e);else if(s==='MF')mf.push(e);else fw.push(e)});
  const av=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:40;
  const [d,m,w]=FORMS[T.form]||[4,4,2];const t=T.tac;
  return{atk:av(fw)*0.42+av(mf)*0.38+av(df)*0.2+(w-2)*1.3+(m-4)*0.4+[-3.5,0,3.5][t]+(home?1.5:0),
         def:av(df)*0.42+av(mf)*0.23+gk*0.35+(d-4)*1.3+[3.5,0,-3.5][t]+(home?1:0),
         mid:av(mf)+(m-4)*1.5};
}
const TXT={
 g:['⚽ โก๊ลลล! {p} ซัดเข้าไปให้ {t}','⚽ ประตู! {p} ปลิดชีพในกรอบเขตโทษ','⚽ {p} โหม่งเข้าไปอย่างสวยงาม!','⚽ {p} หลุดเดี่ยวแล้วแปไปเสาไกล!','⚽ {p} ยิงไกลเสียบสามเหลี่ยม!','⚽ {p} สังหารจุดโทษอย่างเยือกเย็น','⚽ {p} ซ้ำลูกที่กระดอนมาเข้าไป!'],
 sv:['🧤 {k} พุ่งปัดลูกยิงของ {p} ได้อย่างยอดเยี่ยม','🧤 {p} ยิงตรงมือ {k}','🧤 {k} ออกมาตัดหน้า {p} ได้ทัน'],
 c:['{p} ซัดเฉียดเสาออกไปนิดเดียว','{p} โหม่งข้ามคานไป','ลูกยิงของ {p} ชนเสา!','{p} ยิงไกลแต่ไม่ได้ลุ้น','{p} ได้จังหวะยิงแต่ถูกบล็อกไว้','{p} หลุดเข้าไปแต่ยิงข้ามคาน']
};
function fill(s,o){return s.replace(/\{(\w)\}/g,(_,k)=>o[k]||'')}
function wpick(list,wf){let tot=0;const w=list.map(x=>{const v=Math.max(0.01,wf(x));tot+=v;return v});let r=rnd()*tot;for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i]}return list[list.length-1]}
function shortN(p){if(!p)return'-';const w=p.n.split(' ');if(p.cu)return p.n.length<=12?p.n:w[0];return p.f?w[w.length-1]:w[0]+(w[1]?' '+w[1][0]+'.':'')}
function fullN(p){return p?p.n:'-'}
function simMatch(h,a){
  const TH=S.teams[h],TA=S.teams[a];const P=[power(TH,true),power(TA,false)];
  const xg=[clamp(1.3*Math.exp((P[0].atk-P[1].def)/20),0.15,4),clamp(1.3*Math.exp((P[1].atk-P[0].def)/20),0.15,4)];
  const sl=[slotsOf(TH.form),slotsOf(TA.form)];
  const on=[TH.xi.filter(id=>S.pl[id]),TA.xi.filter(id=>S.pl[id])];
  const gkOf=s=>{const T=s?TA:TH;const id=T.xi[0];return S.pl[id]};
  const mult=[1,1],sc=[0,0],sh=[0,0],ot=[0,0],cards=[0,0],ev=[],yel={},out=new Set(),inj=[],red=[],scorers=[],assists=[];
  const posOf=(s,id)=>{const T=s?TA:TH;const i=T.xi.indexOf(id);return sl[s][i]||S.pl[id].pos};
  const tn=s=>s?TA.name:TH.name;
  ev.push({m:0,s:-1,k:'ko',x:'🟢 เริ่มเกม! '+TH.name+' พบ '+TA.name});
  for(let m=1;m<=93;m++){
    if(m===46)ev.push({m:45,s:-1,k:'ht',x:'⏸️ หมดครึ่งแรก '+sc[0]+'-'+sc[1]});
    for(let s=0;s<2;s++){
      const act=on[s].filter(id=>!out.has(id));if(!act.length)continue;
      const lam=xg[s]*mult[s]/90;
      if(rnd()<lam){
        const shooter=wpick(act.filter(id=>posOf(s,id)!=='GK'),id=>({FW:6,MF:3,DF:1})[posOf(s,id)]*Math.pow(S.pl[id].o/60,2));
        if(shooter==null)continue;
        let as=null;if(rnd()<0.7){const c=act.filter(id=>id!==shooter&&posOf(s,id)!=='GK');if(c.length)as=wpick(c,id=>({MF:5,FW:3,DF:2})[posOf(s,id)])}
        sc[s]++;sh[s]++;ot[s]++;scorers.push(shooter);if(as)assists.push(as);
        ev.push({m,s,k:'g',x:fill(pick(TXT.g),{p:fullN(S.pl[shooter]),t:tn(s)})+(as?' (แอสซิสต์ '+fullN(S.pl[as])+')':'')+' — '+sc[0]+'-'+sc[1]});
      }else if(rnd()<lam*5.5){
        const c=act.filter(id=>posOf(s,id)!=='GK');if(!c.length)continue;
        const p=wpick(c,id=>({FW:5,MF:3,DF:1})[posOf(s,id)]);sh[s]++;
        if(rnd()<0.33){ot[s]++;ev.push({m,s,k:'sv',x:fill(pick(TXT.sv),{p:fullN(S.pl[p]),k:fullN(gkOf(1-s))})})}
        else ev.push({m,s,k:'c',x:fill(pick(TXT.c),{p:fullN(S.pl[p])})});
      }
      if(rnd()<0.021){const p=pick(act);yel[p]=(yel[p]||0)+1;cards[s]++;
        if(yel[p]>=2){out.add(p);red.push(p);mult[s]*=0.72;mult[1-s]*=1.12;ev.push({m,s,k:'r',x:'🟥 '+fullN(S.pl[p])+' ใบเหลืองใบที่สอง โดนไล่ออก!'})}
        else ev.push({m,s,k:'y',x:'🟨 '+fullN(S.pl[p])+' ('+(s?TA.sh:TH.sh)+') รับใบเหลือง'})}
      else if(rnd()<0.0009){const p=pick(act);out.add(p);red.push(p);cards[s]++;mult[s]*=0.72;mult[1-s]*=1.12;ev.push({m,s,k:'r',x:'🟥 ใบแดงตรงๆ! '+fullN(S.pl[p])+' ต้องออกจากสนาม'})}
      if(rnd()<0.0017){const p=pick(act);if(!inj.includes(p)){inj.push(p);mult[s]*=0.97;ev.push({m,s,k:'i',x:'🚑 '+fullN(S.pl[p])+' บาดเจ็บ ต้องเปลี่ยนตัวออก'})}}
    }
  }
  ev.push({m:93,s:-1,k:'ft',x:'🏁 จบเกม '+TH.name+' '+sc[0]+'-'+sc[1]+' '+TA.name});
  const pm=P[0].mid*P[0].mid,qm=P[1].mid*P[1].mid;const ps=clamp(Math.round(pm/(pm+qm)*100+(rnd()*6-3)+2),28,72);
  return{h,a,hg:sc[0],ag:sc[1],ev,ps:[ps,100-ps],sh,ot,cd:cards,xi:[TH.xi.slice(),TA.xi.slice()],scorers,assists,inj,red};
}

/* ---------------- ตาราง ---------------- */
function table(excludeRound){
  const t=S.teams.map(T=>({id:T.id,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0,fm:[]}));
  S.res.forEach((rd,ri_)=>{if(!rd||ri_===excludeRound)return;rd.forEach(m=>{const A=t[m.h],B=t[m.a];A.p++;B.p++;A.gf+=m.hg;A.ga+=m.ag;B.gf+=m.ag;B.ga+=m.hg;
    if(m.hg>m.ag){A.w++;B.l++;A.pts+=3;A.fm.push('W');B.fm.push('L')}else if(m.hg<m.ag){B.w++;A.l++;B.pts+=3;A.fm.push('L');B.fm.push('W')}else{A.d++;B.d++;A.pts++;B.pts++;A.fm.push('D');B.fm.push('D')}})});
  return t.sort((x,y)=>y.pts-x.pts||(y.gf-y.ga)-(x.gf-x.ga)||y.gf-x.gf||S.teams[x.id].name.localeCompare(S.teams[y.id].name,'th'));
}

/* ---------------- หลังจบนัด ---------------- */
function applyRound(results){
  const played=new Set();
  results.forEach(r=>{r.xi.forEach(x=>x.forEach(id=>played.add(id)))});
  Object.values(S.pl).forEach(p=>{
    if(p.ij>0&&!played.has(p.id))p.ij--;
    if(p.sp>0&&!played.has(p.id))p.sp--;
    p.ft=Math.min(100,p.ft+14);
    if(played.has(p.id)){p.ap++;p.ft=Math.max(35,p.ft-ri(16,22))}
    let ch=0;const pl=played.has(p.id);
    if(p.ag<=21){if(p.o<p.pt&&rnd()<(pl?0.16:0.08))ch=1}
    else if(p.ag<=25){if(p.o<p.pt&&rnd()<(pl?0.09:0.04))ch=1}
    else if(p.ag>=33){if(rnd()<0.06)ch=-1}
    else if(p.ag>=30){if(rnd()<0.03)ch=-1}
    p.o=clamp(p.o+ch,35,94);p.v=valueOf(p);
  });
  results.forEach(r=>{
    r.scorers.forEach(id=>{if(S.pl[id])S.pl[id].g++});r.assists.forEach(id=>{if(S.pl[id])S.pl[id].as++});
    r.inj.forEach(id=>{const p=S.pl[id];if(p){p.ij=ri(1,4);if(S.teams[p.t]&&S.teams[p.t].owner)addNews('🚑 '+p.n+' ('+S.teams[p.t].sh+') บาดเจ็บ พัก '+p.ij+' นัด')}});
    r.red.forEach(id=>{const p=S.pl[id];if(p)p.sp=1});
    const H=S.teams[r.h],A=S.teams[r.a];
    H.budget=r1(H.budget+0.6+(H.rep-55)*0.07);
  });
  S.teams.forEach(T=>{const sq=squad(T.id);T.budget=r1(T.budget+0.5-sq.reduce((s,p)=>s+p.v,0)*0.005)});
  aiMarket();
}
function aiMarket(){
  S.teams.forEach(T=>{
    if(T.owner)return;const sq=squad(T.id);
    if(sq.length>26){const w=sq.sort((a,b)=>a.o-b.o)[0];w.t=-1;T.budget=r1(T.budget+w.v*0.7);return}
    if(rnd()>0.17||sq.length>=28)return;
    fixXI(T);const sl=slotsOf(T.form);let wi=-1,wo=99;
    T.xi.forEach((id,i)=>{const p=S.pl[id];if(p&&i>0&&p.o<wo){wo=p.o;wi=i}});
    if(wi<0)return;const pos=sl[wi];
    const c=Object.values(S.pl).filter(p=>p.t===-1&&p.pos===pos&&p.o>wo+2&&p.v<=T.budget*0.5).sort((a,b)=>b.o-a.o)[0];
    if(c){c.t=T.id;T.budget=r1(T.budget-c.v);if(c.o>=66)addNews('✍️ '+T.name+' คว้าตัว '+c.n+' ('+c.pos+' '+c.o+') '+money(c.v)+' ล้าน')}
  });
}
function seasonEnd(){
  const tb=table();
  tb.forEach((row,i)=>{const T=S.teams[row.id];T.budget=r1(T.budget+Math.max(3,30-i*1.8))});
  const top=Object.values(S.pl).filter(p=>p.g>0).sort((a,b)=>b.g-a.g)[0];
  S.champs.push({s:S.season,t:tb[0].id});
  S.final={tb:tb.map(r=>r.id),top:top?{n:top.n,g:top.g,t:top.t}:null};
  S.phase='end';S.live=null;
  addNews('🏆 '+S.teams[tb[0].id].name+' คว้าแชมป์ไทยลีก '+seasonLabel(S.season)+'!');
}
function newSeason(){
  S.season++;S.round=0;S.res=[];S.last=null;S.final=null;
  Object.values(S.pl).forEach(p=>{
    p.ag++;p.g=0;p.as=0;p.ap=0;p.ft=100;p.ij=0;p.sp=0;if(p.ag>=29)p.pt=p.o;
    if(p.ag>=36||(p.ag>=34&&rnd()<0.4)){
      const T=S.teams[p.t];delete S.pl[p.id];
      if(T){if(p.o>=68)addNews('👋 '+p.n+' ('+T.sh+') ประกาศแขวนสตั๊ด');
        if(squad(T.id).length<22){const y=mkPlayer(T.id,p.pos,T.rep-12+gauss()*4,ri(17,19),0);y.pt=clamp(y.o+ri(10,20),y.o,92);y.v=valueOf(y)}}
    }else p.v=valueOf(p);
  });
  const fr=Object.values(S.pl).filter(p=>p.t===-1);fr.sort((a,b)=>a.o-b.o).slice(0,Math.max(0,fr.length-12)).forEach(p=>delete S.pl[p.id]);
  while(Object.values(S.pl).filter(p=>p.t===-1).length<26)genFree();
  S.teams.forEach(T=>{if(!T.owner)autoXI(T);else fixXI(T)});
  S.fx=makeFixtures(16);S.phase='pre';
  Object.values(S.humans).forEach(h=>h.ready=false);
  addNews('📅 เปิดฤดูกาลใหม่ '+seasonLabel(S.season));
}

/* ---------------- เล่นแต่ละนัด ---------------- */
let liveTimer=null,playTimer=null;
function playRound(){
  if(!S||S.phase!=='pre')return;clearTimeout(playTimer);
  const r=S.round;
  S.teams.forEach(T=>{if(!T.owner){if(rnd()<0.15)T.form=pick(['4-4-2','4-3-3','4-5-1','3-5-2','4-4-2']);T.tac=1;autoXI(T)}else fixXI(T)});
  const results=S.fx[r].map(([h,a])=>simMatch(h,a));
  S.res[r]=results.map(m=>({h:m.h,a:m.a,hg:m.hg,ag:m.ag}));
  S.last={r,m:results.map(m=>({h:m.h,a:m.a,hg:m.hg,ag:m.ag,ev:m.ev,ps:m.ps,sh:m.sh,ot:m.ot,cd:m.cd}))};
  applyRound(results);
  Object.values(S.humans).forEach(h=>h.ready=false);
  S.phase='live';S.live={id:Math.random().toString(36).slice(2,8),r,at:Date.now(),dur:LIVE_MS};
  bump();
  clearTimeout(liveTimer);liveTimer=setTimeout(endLive,LIVE_MS+2500);
}
function endLive(){
  if(!S||S.phase!=='live')return;clearTimeout(liveTimer);
  S.round++;S.live=null;
  if(S.round>=ROUNDS)seasonEnd();else S.phase='pre';
  bump();
}
function checkReady(){
  if(!S||S.phase!=='pre')return;
  const hs=Object.values(S.humans).filter(h=>h.team!=null&&h.on);
  if(hs.length&&hs.every(h=>h.ready)){clearTimeout(playTimer);playTimer=setTimeout(playRound,1200)}
  else clearTimeout(playTimer);
}

/* ---------------- คำสั่งจากผู้เล่น (รันบนโฮสต์เท่านั้น) ---------------- */
function teamOf(u){const h=S.humans[u];return h&&h.team!=null?S.teams[h.team]:null}
function act(u,m){
  if(!S||!m||typeof m!=='object')return;
  const isH=u===S.host,h=S.humans[u],T=teamOf(u);
  switch(m.type){
    case 'hello':{const nm=String(m.name||'ผู้จัดการ').trim().slice(0,16)||'ผู้จัดการ';
      if(!h){if(Object.keys(S.humans).length>=24)return'ห้องเต็มแล้ว';S.humans[u]={name:nm,team:null,ready:false,on:true}}
      else{h.name=nm;h.on=true}break}
    case 'pick':{if(!h)return;const t=+m.team;const X=S.teams[t];if(!X)return;
      if(S.phase==='live')return'รอให้จบนัดนี้ก่อน';
      if(X.owner&&X.owner!==u)return'ทีมนี้มีคนคุมแล้ว';
      if(T&&T!==X)T.owner=null;X.owner=u;h.team=t;h.ready=false;
      if(S.phase!=='lobby')addNews('👔 '+h.name+' เข้ารับตำแหน่งผู้จัดการ '+X.name);break}
    case 'unpick':{if(T){T.owner=null;h.team=null;h.ready=false}break}
    case 'lineup':{if(!T)return;if(m.form&&FORMS[m.form])T.form=m.form;if(m.tac===0||m.tac===1||m.tac===2)T.tac=m.tac;
      if(Array.isArray(m.xi)){const sl=slotsOf(T.form);const seen=new Set();
        T.xi=sl.map((_,i)=>{const id=m.xi[i];const p=S.pl[id];if(p&&p.t===T.id&&!seen.has(id)){seen.add(id);return id}return null})}
      break}
    case 'auto':{if(!T)return;autoXI(T);break}
    case 'ready':{if(!T||S.phase!=='pre')return;h.ready=!!m.v;break}
    case 'buy':{if(!T)return;const p=S.pl[m.pid];if(!p)return'ไม่พบนักเตะ';if(p.t===T.id)return;
      const seller=p.t>=0?S.teams[p.t]:null;if(seller&&seller.owner)return'ซื้อจากทีมของเพื่อนไม่ได้';
      if(seller&&squad(seller.id).length<=18)return seller.name+' ไม่ยอมปล่อยตัว (ผู้เล่นไม่พอ)';
      if(squad(T.id).length>=MAX_SQUAD)return'ทีมเต็ม '+MAX_SQUAD+' คนแล้ว';
      const price=priceOf(p);if(T.budget<price)return'งบไม่พอ';
      T.budget=r1(T.budget-price);if(seller){seller.budget=r1(seller.budget+price);seller.xi=seller.xi.map(x=>x===p.id?null:x);fixXI(seller)}
      p.t=T.id;addNews('✍️ '+T.name+' ซื้อ '+p.n+' ('+p.pos+' '+p.o+') '+money(price)+' ล้าน');break}
    case 'sell':{if(!T)return;const p=S.pl[m.pid];if(!p||p.t!==T.id)return;
      if(squad(T.id).length<=MIN_SQUAD)return'ต้องมีนักเตะอย่างน้อย '+MIN_SQUAD+' คน';
      const g=r1(p.v*0.75);T.budget=r1(T.budget+g);p.t=-1;T.xi=T.xi.map(x=>x===p.id?null:x);
      addNews('💸 '+T.name+' ขาย '+p.n+' ได้ '+money(g)+' ล้าน');break}
    case 'rename':{const p=S.pl[m.pid];if(!p)return;if(!(isH||(T&&p.t===T.id)))return'เปลี่ยนชื่อได้เฉพาะนักเตะทีมตัวเอง';
      const n=String(m.n||'').replace(/\s+/g,' ').trim().slice(0,28);if(!n)return;p.n=n;p.cu=1;break}
    case 'bulk':{if(!T)return;const r=bulkRename(T,String(m.txt||''));bump();return r.msg}
    case 'start':{if(!isH||S.phase!=='lobby')return;S.phase='pre';addNews('📣 ฤดูกาล '+seasonLabel(S.season)+' เริ่มแล้ว! ผู้จัดการ '+Object.values(S.humans).filter(x=>x.team!=null).map(x=>x.name).join(', '));break}
    case 'play':{if(!isH)return;playRound();return}
    case 'skiplive':{if(!isH)return;endLive();return}
    case 'newseason':{if(!isH||S.phase!=='end')return;newSeason();break}
    default:return;
  }
  bump();checkReady();
}
function priceOf(p){return p.t>=0?r1(p.v*1.3):r1(p.v)}
function bulkRename(T,txt){
  const map={gk:'GK',df:'DF',mf:'MF',fw:'FW','ผู้รักษาประตู':'GK','ประตู':'GK','กองหลัง':'DF','กองกลาง':'MF','กองหน้า':'FW'};
  const order={GK:0,DF:1,MF:2,FW:3};
  const sq=squad(T.id).sort((a,b)=>order[a.pos]-order[b.pos]||b.o-a.o);const used=new Set();let n=0,skip=0;
  txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    let pos=null,name=line.replace(/^\d+[\s.)\-]*/,'');
    const mm=name.match(/^(GK|DF|MF|FW|ผู้รักษาประตู|ประตู|กองหลัง|กองกลาง|กองหน้า)[\s:.\-]+/i);
    if(mm){pos=map[mm[1].toLowerCase()]||map[mm[1]];name=name.slice(mm[0].length)}
    name=name.replace(/\s+/g,' ').trim().slice(0,28);if(!name){skip++;return}
    const p=sq.find(q=>!used.has(q.id)&&(!pos||q.pos===pos));
    if(!p){skip++;return}used.add(p.id);p.n=name;p.cu=1;n++;
  });
  return{msg:'เปลี่ยนชื่อแล้ว '+n+' คน'+(skip?' (ข้าม '+skip+' บรรทัด)':'')};
}

let isHost=false,peer=null,conn=null,netOk=false,clockOff=0,retryT=null,leaving=false;
const conns=new Map();
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<5;i++)s+=c[ri(0,c.length-1)];return s}
let bcT=null,saveT=null;
function bump(){
  if(!S)return;S.seq++;
  if(isHost){clearTimeout(bcT);bcT=setTimeout(broadcast,40);clearTimeout(saveT);saveT=setTimeout(()=>LS.set('fm_host',JSON.stringify(S)),300)}
  render();
}
function broadcast(){if(!isHost||!S)return;const msg={t:'s',s:S,now:Date.now()};for(const c of conns.keys())if(c.open)try{c.send(msg)}catch(e){}}
function send(m){
  if(isHost){const err=act(uid,m);if(err)toast(err);return}
  if(conn&&conn.open){try{conn.send({t:'a',u:uid,m})}catch(e){toast('ส่งไม่สำเร็จ')}}else toast('กำลังเชื่อมต่อใหม่...');
}
function hostStart(solo){
  isHost=true;leaving=false;newGame(solo?'SOLO':genCode(),solo);act(uid,{type:'hello',name:myName});
  if(!solo)openHostPeer(0);UI.tab='home';bump();
}
function resumeHost(){
  try{S=JSON.parse(LS.get('fm_host','null'))}catch(e){S=null}
  if(!S){toast('ไม่พบเกมที่บันทึกไว้');return}
  isHost=true;leaving=false;S.host=uid;Object.values(S.humans).forEach(h=>h.on=false);
  if(S.humans[uid])S.humans[uid].on=true;else act(uid,{type:'hello',name:myName});
  if(S.phase==='live'){S.live.at=Date.now()-S.live.dur;endLive()}
  if(!S.solo)openHostPeer(0);UI.tab='home';bump();
}
function openHostPeer(tries){
  if(typeof Peer==='undefined'){netOk=false;toast('โหลดระบบออนไลน์ไม่ได้ — เล่นคนเดียวได้ปกติ');return}
  try{if(peer)peer.destroy()}catch(e){}
  peer=new Peer(PREFIX+S.code,PEER_OPTS);
  peer.on('open',()=>{netOk=true;render()});
  peer.on('connection',c=>{c.on('data',d=>hostData(c,d));c.on('close',()=>hostClose(c));c.on('error',()=>hostClose(c))});
  peer.on('disconnected',()=>{netOk=false;render();if(!leaving)setTimeout(()=>{try{peer&&!peer.destroyed&&peer.reconnect()}catch(e){}},1500)});
  peer.on('error',e=>{netOk=false;render();
    if(leaving)return;
    if(e.type==='unavailable-id'){if(tries<12)setTimeout(()=>openHostPeer(tries+1),4000);else toast('รหัสห้องถูกใช้อยู่ ลองสร้างห้องใหม่')}
    else if(['network','server-error','socket-error','socket-closed'].includes(e.type)){setTimeout(()=>openHostPeer(tries+1),4000)}
  });
}
function hostData(c,d){
  if(!d||d.t!=='a'||!S)return;const u=String(d.u||'').slice(0,24);if(!u)return;
  if(d.m&&d.m.type==='hello'){for(const [cc,uu] of conns)if(uu===u&&cc!==c){conns.delete(cc);try{cc.close()}catch(e){}}conns.set(c,u)}
  if(conns.get(c)!==u)return;
  const err=act(u,d.m);
  if(err)try{c.send({t:'err',m:err})}catch(e){}
  if(d.m&&d.m.type==='hello')try{c.send({t:'s',s:S,now:Date.now()})}catch(e){}
}
function hostClose(c){const u=conns.get(c);conns.delete(c);if(u&&S&&S.humans[u]&&![...conns.values()].includes(u)){S.humans[u].on=false;S.humans[u].ready=false;bump();checkReady()}}
function joinRoom(code){
  code=String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<4){toast('ใส่รหัสห้องให้ถูกต้อง');return}
  if(typeof Peer==='undefined'){toast('โหลดระบบออนไลน์ไม่ได้ ลองรีเฟรช');return}
  isHost=false;leaving=false;LS.set('fm_last',code);joinCode=code;UI.tab='home';connectClient(true);render();
}
let joinCode=null,firstJoin=false;
function connectClient(first){
  clearTimeout(retryT);firstJoin=!!first;
  try{if(peer)peer.destroy()}catch(e){}
  netOk=false;peer=new Peer(PEER_OPTS);
  peer.on('open',()=>{
    conn=peer.connect(PREFIX+joinCode,{reliable:true});
    conn.on('open',()=>{netOk=true;conn.send({t:'a',u:uid,m:{type:'hello',name:myName}});render()});
    conn.on('data',onClientData);
    conn.on('close',lost);conn.on('error',lost);
  });
  peer.on('error',e=>{
    if(leaving)return;
    if(e.type==='peer-unavailable'&&!S){toast('ไม่พบห้อง '+joinCode+' (เจ้าของห้องอาจออฟไลน์)');goHome();return}
    lost();
  });
}
function lost(){if(leaving||isHost)return;netOk=false;render();clearTimeout(retryT);retryT=setTimeout(()=>connectClient(false),3000)}
function onClientData(d){
  if(!d)return;
  if(d.t==='s'){const prevLive=S&&S.live&&S.live.id;S=d.s;clockOff=d.now-Date.now();
    if(S.live&&S.live.id!==prevLive){UI.tab='home';UI.goalSeen=0}
    render()}
  else if(d.t==='err')toast(d.m);
}
function goHome(){
  leaving=true;clearTimeout(retryT);clearTimeout(liveTimer);clearTimeout(playTimer);
  try{if(peer)peer.destroy()}catch(e){}peer=null;conn=null;conns.clear();
  S=null;isHost=false;netOk=false;closeModal();render();
}

function liveSound(){

  const min=liveMin();const g=m.ev.filter(e=>e.k==='g'&&e.m<=min);const key=S.live.id+':'+g.length;

function beep(good){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const t=actx.currentTime;
  (good?[523,659,784,1047]:[330,262]).forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=good?'triangle':'sawtooth';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t+i*0.12);g.gain.exponentialRampToValueAtTime(0.18,t+i*0.12+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*0.12+0.25);o.connect(g).connect(actx.destination);o.start(t+i*0.12);o.stop(t+i*0.12+0.3)})}catch(e){}}

    let r=UI.fxR==null?Math.min(S.round,ROUNDS-1):UI.fxR;r=clamp(r,0,ROUNDS-1);UI.fxR=r;const T=myTeam();
    html+='<div class="row" style="margin-bottom:8px"><button class="btn sm" data-a="fxr" data-v="'+(r-1)+'">◀</button><b class="grow" style="text-align:center">นัดที่ '+(r+1)+'</b><button class="btn sm" data-a="fxr" data-v="'+(r+1)+'">▶</button></div><div class="card">'+
     S.fx[r].map(([h,a])=>{const res=S.res[r]&&r!==ex?S.res[r].find(x=>x.h===h):null;const H=S.teams[h],A=S.teams[a];const mine=T&&(h===T.id||a===T.id);
      return '<div class="res'+(mine?' me':'')+'"><span class="tn r">'+esc(H.name)+'</span>'+badge(H,22)+'<span class="sc">'+(res?res.hg+' - '+res.ag:'vs')+'</span>'+badge(A,22)+'<span class="tn">'+esc(A.name)+'</span></div>'}).join('')+'</div>';
  }
  if(S.champs.length)html+='<div class="card"><h3>🏆 ทำเนียบแชมป์</h3>'+S.champs.slice().reverse().map(c=>'<div class="mini"><span>'+seasonLabel(c.s)+'</span><span class="grow"></span>'+badge(S.teams[c.t],22)+' '+esc(S.teams[c.t].name)+'</div>').join('')+'</div>';
  return html;
}

/* ---------- ห้อง ---------- */
function vRoom(){
  const link=location.origin+location.pathname+'?room='+S.code;const hs=Object.entries(S.humans);const T=myTeam();
  let html='';
  if(!S.solo)html+='<div class="card"><div class="mut sm" style="text-align:center">รหัสห้อง</div><div class="code">'+S.code+'</div><div class="mut sm" style="text-align:center">'+(isHost?'คุณเป็นเจ้าของห้อง — ต้องเปิดแอปค้างไว้ระหว่างเล่น':'')+'</div><div class="row" style="margin-top:8px"><button class="btn grow" data-a="share" data-v="'+esc(link)+'">📤 ชวนเพื่อน</button><button class="btn grow" data-a="copy" data-v="'+esc(link)+'">📋 คัดลอก</button></div></div>'+
   '<div class="card"><h3>ผู้จัดการ ('+hs.length+')</h3><div class="hl">'+hs.map(([u,x])=>'<div class="hu"><span class="dot'+(x.on?'':' off')+'"></span><b>'+esc(x.name)+'</b>'+(u===S.host?'<span class="mut sm">👑</span>':'')+'<span class="grow"></span>'+(x.team!=null?badge(S.teams[x.team],24)+' <span class="sm">'+esc(S.teams[x.team].sh)+'</span>':'<span class="mut sm">ผู้ชม</span>')+'</div>').join('')+'</div></div>';
  html+='<div class="card"><h3>'+(T?'ย้ายไปคุมทีมอื่น':'เลือกทีมที่ยังว่าง')+'</h3><div class="mut sm" style="margin-bottom:8px">ทีมเดิมจะกลับไปให้ AI คุม</div>'+vTeamGrid()+'</div>';
  html+='<div class="card"><h3>ตั้งค่า</h3><button class="btn blk" data-a="snd">'+(UI.sound?'🔊 เสียงตอนยิงประตู: เปิด':'🔇 เสียงตอนยิงประตู: ปิด')+'</button></div>';
  html+='<div class="card"><h3>วิธีเล่น</h3><div class="sm mut">1) จัดตัวจริง เลือกแผน และแท็กติกในแท็บ “ทีม”<br>2) ซื้อ-ขายนักเตะในแท็บ “ตลาด”<br>3) กด “พร้อมเตะ” — เมื่อทุกคนพร้อม ทุกคู่จะแข่งพร้อมกันพร้อมบรรยายสด<br>4) แข่ง 30 นัด เหย้า-เยือน จบฤดูกาลรับเงินรางวัลตามอันดับ<br>5) นักเตะลงเล่นติดกันจะล้า ควรหมุนเวียน · ดาวรุ่งได้ลงสนามจะเก่งขึ้นเร็ว</div></div>';
  html+='<button class="btn red blk" data-a="leave">🚪 ออกจากห้อง</button>';
  if(isHost)html+='<p class="mut sm" style="text-align:center">เกมถูกบันทึกในเครื่องนี้ กลับมาเล่นต่อได้จากหน้าแรก</p>';
  return html;
}

/* ---------- Modal ---------- */
function openModal(html){$('#modal').innerHTML='<div class="bg" data-a="closebg"><div class="sh">'+html+'</div></div>'}
function closeModal(){$('#modal').innerHTML=''}
function showPlayer(pid){
  const p=S.pl[pid];if(!p)return;const T=myTeam();const own=p.t>=0?S.teams[p.t]:null;const mine=T&&p.t===T.id;
  const canRename=mine||amHost();const buyable=T&&!mine&&!(own&&own.owner);
  openModal('<div class="row">'+(own?badge(own,44):'')+'<div class="grow"><h2>'+esc(p.n)+'</h2><div class="mut sm">'+posTag(p)+POSN[p.pos]+' · '+(own?esc(own.name):'ฟรีเอเย่นต์')+(p.f?' · ต่างชาติ':'')+'</div></div></div>'+
   '<div class="kv"><div><b>'+p.o+'</b><small>พลังตอนนี้</small></div><div><b>'+(p.ag<=26?p.pt:'—')+'</b><small>ศักยภาพ</small></div><div><b>'+p.ag+'</b><small>อายุ</small></div>'+
   '<div><b>'+p.ft+'%</b><small>ความฟิต</small></div><div><b>'+money(p.v)+'</b><small>มูลค่า (ล.)</small></div><div><b>'+p.ap+'</b><small>ลงเล่น</small></div>'+
   '<div><b>'+p.g+'</b><small>ประตู</small></div><div><b>'+p.as+'</b><small>แอสซิสต์</small></div><div><b>'+(p.ij?'🚑 '+p.ij:p.sp?'🟥 แบน':'✅')+'</b><small>สถานะ</small></div></div>'+
   (canRename?'<label class="lb">เปลี่ยนชื่อ</label><div class="row"><input class="in grow" id="rn" maxlength="28" value="'+esc(p.n)+'"><button class="btn" data-a="rename" data-v="'+p.id+'">บันทึก</button></div>':'')+
   (mine?'<button class="btn red blk" style="margin-top:10px" data-a="sell" data-v="'+p.id+'">💸 ขายให้ตลาด รับ '+money(p.v*0.75)+' ล้าน</button>':'')+
   (buyable?'<button class="btn pri blk" style="margin-top:10px" data-a="buy" data-v="'+p.id+'"'+(T.budget>=priceOf(p)?'':' disabled')+'>✍️ ซื้อ '+money(priceOf(p))+' ล้าน</button>':'')+
   '<button class="btn blk" style="margin-top:8px" data-a="close">ปิด</button>');
}
function showMatch(i){
  const m=S.last.m[i];const H=S.teams[m.h],A=S.teams[m.a];
  const st=(l,a,b)=>'<div class="stat"><b>'+a+'</b><div class="bar"><i style="width:'+(a+b?a/(a+b)*100:50)+'%;background:'+H.c1+'"></i><i style="flex:1;background:'+A.c1+'"></i></div><b>'+b+'</b></div><div class="mut sm" style="text-align:center;margin-top:-4px">'+l+'</div>';
  openModal('<div class="vs">'+'<div class="side">'+badge(H,44)+'<b>'+esc(H.name)+'</b></div><div class="mid">'+m.hg+' - '+m.ag+'<small>จบเกม</small></div><div class="side">'+badge(A,44)+'<b>'+esc(A.name)+'</b></div></div>'+
   st('ครองบอล %',m.ps[0],m.ps[1])+st('ยิง',m.sh[0],m.sh[1])+st('ยิงตรงกรอบ',m.ot[0],m.ot[1])+st('ใบเหลือง/แดง',m.cd[0],m.cd[1])+
   '<h3 style="margin:12px 0 6px">เหตุการณ์สำคัญ</h3>'+(m.ev.filter(e=>['g','r','i','y'].includes(e.k)).map(e=>'<div class="ev '+(e.k==='g'?'g':e.k==='r'?'r':'')+'"><span class="m">'+(e.m>90?'90+'+(e.m-90):e.m)+"'</span><span>"+esc(e.x)+'</span></div>').join('')||'<div class="mut">ไม่มีเหตุการณ์สำคัญ</div>')+
   '<button class="btn blk" style="margin-top:12px" data-a="close">ปิด</button>');
}
function showBulk(){
  const T=myTeam();if(!T)return;
  openModal('<h2>📝 ใส่ชื่อนักเตะจริง</h2><p class="mut sm">วางรายชื่อ 1 คนต่อบรรทัด ใส่ตำแหน่งนำหน้าได้ (GK / DF / MF / FW) เช่น<br><code>GK สมชาย ใจดี</code><br><code>DF ...</code><br>ถ้าไม่ใส่ตำแหน่ง จะไล่ใส่ตามลำดับ ผู้รักษาประตู → กองหลัง → กองกลาง → กองหน้า (เรียงจากคนเก่งสุด)</p>'+
   '<textarea class="in" id="bk" rows="10" placeholder="GK ชื่อ นามสกุล&#10;DF ชื่อ นามสกุล"></textarea>'+
   '<button class="btn pri blk" style="margin-top:10px" data-a="dobulk">บันทึกรายชื่อ</button><button class="btn blk" style="margin-top:8px" data-a="close">ยกเลิก</button>');
}
let toastT=null;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400)}
async function shareLink(link){
  const text='มาเล่นเกมผู้จัดการทีมไทยลีกด้วยกัน! รหัสห้อง '+S.code;
  if(navigator.share){try{await navigator.share({title:'KG ผู้จัดการทีม',text,url:link});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyText(link);
}
function copyText(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('คัดลอกแล้ว'),()=>prompt('คัดลอกลิงก์นี้',t));else prompt('คัดลอกลิงก์นี้',t)}
function saveName(){const el=$('#nm');if(el){myName=el.value.trim().slice(0,16);LS.set('fm_name',myName)}return myName}

/* ---------- Events ---------- */
const A={
  create(){if(!saveName()){toast('ใส่ชื่อก่อนนะ');$('#nm').focus();return}hostStart(false)},
  solo(){if(!saveName())myName='ผู้จัดการ';hostStart(true)},
  resume(){saveName();if(!myName)myName='ผู้จัดการ';resumeHost()},
  join(d){if(!saveName()){toast('ใส่ชื่อก่อนนะ');$('#nm').focus();return}joinRoom(d.v||($('#jc')&&$('#jc').value))},
  leave(){if(isHost&&!S?.solo&&!confirm('ออกจากห้อง? เพื่อนจะหลุดจากเกม (เกมยังถูกบันทึกในเครื่องนี้)'))return;goHome()},
  tab(d){UI.tab=d.v;render();window.scrollTo(0,0)},
  pick(d){send({type:'pick',team:+d.v})},
  start(){send({type:'start'})},
  ready(d){send({type:'ready',v:d.v==='1'});if(!isHost&&me()){me().ready=d.v==='1';render()}},
  play(){send({type:'play'})},
  skiplive(){send({type:'skiplive'})},
  skip(){if(S.live)UI.skip[S.live.id]=1;render()},
  unskip(){if(S.live)delete UI.skip[S.live.id];render()},
  liveidx(d){UI.liveSel={id:S.live.id,i:+d.v};render();window.scrollTo(0,0)},
  newseason(){send({type:'newseason'})},
  form(d){const T=myTeam();lineupChange(T,X=>{X.form=d.v;autoXIlocal(X)})},
  tac(d){const T=myTeam();lineupChange(T,X=>{X.tac=+d.v})},
  auto(){const T=myTeam();lineupChange(T,X=>autoXIlocal(X))},
  tog(d){togglePlayer(+d.v)},
  unslot(d){const T=myTeam();lineupChange(T,X=>{X.xi[+d.v]=null})},
  slotpick(d){UI.tab='team';const T=myTeam();const pos=slotsOf(T.form)[+d.v];toast('เลือก '+POSN[pos]+' จากรายชื่อด้านล่าง')},
  pl(d){showPlayer(+d.v)},
  match(d){showMatch(+d.v)},
  mksrc(d){UI.mkSrc=d.v;render()},mkpos(d){UI.mkPos=d.v;render()},mksort(d){UI.mkSort=d.v;render()},
  buy(d){send({type:'buy',pid:+d.v});closeModal()},
  sell(d){if(!confirm('ขายนักเตะคนนี้?'))return;send({type:'sell',pid:+d.v});closeModal()},
  rename(d){const v=$('#rn').value;send({type:'rename',pid:+d.v,n:v});if(!isHost&&S.pl[+d.v]){S.pl[+d.v].n=v.trim()||S.pl[+d.v].n;render()}closeModal();toast('บันทึกชื่อแล้ว')},
  bulk(){showBulk()},
  dobulk(){const txt=$('#bk').value;send({type:'bulk',txt});closeModal();if(isHost){}else toast('ส่งรายชื่อแล้ว')},
  tbl(d){UI.tbl=d.v;render()},fxr(d){UI.fxR=clamp(+d.v,0,ROUNDS-1);render()},
  share(d){shareLink(d.v)},copy(d){copyText(d.v)},
  snd(){UI.sound=!UI.sound;LS.set('fm_snd',UI.sound?'1':'0');if(UI.sound)beep(true);render()},
  close(){closeModal()},
  closebg(d,el,e){if(e.target===el)closeModal()}
};
function autoXIlocal(T){
  // จัดตัวในเครื่องลูกข่าย (ใช้สูตรเดียวกับโฮสต์)
  autoXI(T);
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;const f=A[el.dataset.a];if(!f)return;if(el.disabled)return;f(el.dataset,el,e)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='jc')A.join({})});

/* ---------- live ticker ---------- */
setInterval(()=>{if(S&&S.phase==='live'&&(UI.tab==='home'||UI.tab==='table')&&!$('#modal').innerHTML)render()},700);
window.addEventListener('pagehide',()=>{if(isHost&&S)LS.set('fm_host',JSON.stringify(S))});

/* ---------- start ---------- */
render();
window.__fm={get S(){return S},playRound,endLive,act:(m)=>act(uid,m),uid:()=>uid};
</script>
</body>
</html>
